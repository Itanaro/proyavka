<script>/* black box: errors and boot stages survive a crash, shown in «Файл → Проверка памяти» */
(function(){ function put(k,v){ try{ var a=JSON.parse(localStorage.getItem(k)||'[]'); a.push(new Date().toLocaleTimeString('ru-RU')+' '+v); while(a.length>15) a.shift(); localStorage.setItem(k,JSON.stringify(a)); }catch(_){} }
  window.pvLog=function(v){ put('proyavka.boot', v); };
  window.addEventListener('error', function(e){ put('proyavka.errors', (e.message||'ошибка')+' @'+(e.lineno||'?')); });
  window.addEventListener('unhandledrejection', function(e){ var r=e.reason; put('proyavka.errors', 'promise: '+((r&&r.message)||String(r)).slice(0,160)); });
  pvLog('старт страницы'); })();
</script>

<style>
/* Layout: graphite workroom — tools left (left hand), canvas centre, layers slide in from the right.
   Single dark theme on purpose: neutral grey so the UI does not bias colour judgement. */
:root{
  color-scheme: dark;
  --bg:#17181b;        /* around the document */
  --panel:#212328;     /* bars and panels */
  --panel-2:#2a2d33;   /* raised controls */
  --line:#363a42;
  --fg:#e6e7ea;
  --muted:#959ba5;
  --accent:#e2a65a;    /* tungsten key light, used only for "active" */
  --accent-ink:#1d1406;
  --danger:#e07a6a;
  --sans:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto 1fr}

/* top bar */
#top{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:48px;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.tb{height:36px;min-width:36px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg)}
.tb:active{background:var(--panel-2)}
.tb.on{background:var(--accent);color:var(--accent-ink)}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:24px;background:var(--line);flex:none;margin:0 4px}
.brand{font-weight:600;letter-spacing:.02em;padding:0 6px 0 2px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
#splash{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease}
#splash svg{width:120px;height:120px}
#splash b{font-size:22px;font-weight:600;letter-spacing:.04em}
#splash span{font-family:var(--mono);font-size:12px;color:var(--muted)}
#splash.out{opacity:0;pointer-events:none}
#opts{display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts > *{flex:none}
@media (max-width:1000px){.brand{font-size:0;gap:0}.brand svg{width:28px;height:28px}}
.opt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.hs{position:relative;height:30px;width:110px;flex:none;touch-action:none;cursor:pointer}
.hs::before{content:"";position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--line)}
.hs .hf{position:absolute;left:0;top:13px;height:4px;border-radius:2px;background:var(--accent)}
.hs .hk{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.row .hs{flex:1;width:auto}
#opts.tight{gap:8px} #opts.tight .hs{width:80px} #opts.tight .opt{gap:5px}
#adjbar .seg{align-self:flex-start} #adjbar .er{grid-template-columns:150px 1fr 52px} #adjbar canvas.curve{width:100%;aspect-ratio:1.6;max-height:240px;border-radius:10px;touch-action:none;display:block} #adjbar canvas.lv{aspect-ratio:auto;height:64px}
#optMore{min-width:36px;font-size:16px;letter-spacing:1px}
#optPop{position:absolute;z-index:45;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);max-width:min(420px,calc(100vw - 32px))}
#optPop .opt{justify-content:space-between} #optPop .hs{width:150px} #optPop .seg{align-self:flex-start}
.opt .v{font-family:var(--mono);color:var(--fg);min-width:30px;font-size:12px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--panel-2);border-radius:8px;padding:2px}
.seg button{height:30px;padding:0 10px;border-radius:6px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chk{height:30px;padding:0 10px;border-radius:6px;background:var(--panel-2);font-size:13px}
.chk.on{background:color-mix(in srgb,var(--accent) 22%,var(--panel-2));color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
#swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--fg);flex:none;box-shadow:0 0 0 2px var(--panel)}

/* left tool rail */
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;width:58px;overflow-y:auto;scrollbar-width:none}
#rail .tb{width:44px;height:44px;padding:0}
#rail .tb svg{width:22px;height:22px}
#rail .tgm{position:relative}
#rail .tgm::after{content:'';position:absolute;right:5px;bottom:5px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.55}
#flyout{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px;min-width:230px}
#flyout button{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px 0 10px;border-radius:10px;text-align:left;font-size:14px}
#flyout button svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#flyout button .k{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
#flyout button.on{background:var(--accent);color:var(--accent-ink)} #flyout button.on .k{color:inherit;opacity:.7}
#flyout button:active{background:var(--line)}
#flyout .fh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.vs{position:relative;width:26px;height:150px;border-radius:13px;background:var(--panel-2);margin-top:8px;flex:none;touch-action:none}
.vs .fill{position:absolute;left:0;right:0;bottom:0;border-radius:13px;background:color-mix(in srgb,var(--fg) 30%,transparent)}
.vs .knob{position:absolute;left:-3px;right:-3px;height:8px;border-radius:4px;background:var(--fg);transform:translateY(50%)}
.vlabel{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}

/* stage */
#stage{position:relative;overflow:hidden;touch-action:none;background:var(--bg);grid-row:2;grid-column:2;min-width:0;min-height:0}
#stage > canvas,#rail{touch-action:none}
#stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
#status span{background:color-mix(in srgb,var(--panel) 88%,transparent);padding:3px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
#zoomBadge{pointer-events:auto;cursor:pointer}
.hideui #top,.hideui #rail,.hideui #layers,.hideui #selbar,.hideui #xfbar{display:none!important}
.hideui #app{grid-template-rows:0 1fr;grid-template-columns:0 1fr}
.hideui #status{display:none}

/* floating action bars */
.fbar{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.45);width:max-content;max-width:calc(100% - 32px)}
#stage.lyopen .fbar{left:calc((100% - 306px)/2);max-width:calc(100% - 306px - 32px)}
.fbar .seg{margin-right:4px}
.fbar .seg button{height:32px}
.fbar button{height:36px;padding:0 12px;border-radius:8px;white-space:nowrap;font-size:13px}
.fbar button:active{background:var(--panel-2)}
.fbar .pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
#edgebar,#harmbar,#adjbar{flex-direction:column;align-items:stretch;flex-wrap:nowrap;width:min(460px,calc(100% - 24px));padding:12px 14px;gap:10px}
#edgebar .eh,#harmbar .eh,#adjbar .eh{font-weight:600;font-size:14px}
#edgebar .eh span,#harmbar .eh span,#adjbar .eh span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
#edgebar .er,#harmbar .er,#adjbar .er{display:grid;grid-template-columns:132px 1fr 52px;align-items:center;gap:10px;font-size:13px}
#edgebar .er label,#harmbar .er label,#adjbar .er label{color:var(--muted)}
#edgebar .er .v,#harmbar .er .v,#adjbar .er .v{font-family:var(--mono);font-size:12px;text-align:right}
#edgebar .er .hs,#harmbar .er .hs,#adjbar .er .hs{height:32px;width:auto}
#edShift::after{content:"";position:absolute;left:50%;top:9px;width:2px;height:12px;margin-left:-1px;background:var(--muted);border-radius:1px}
#edgebar .eb,#harmbar .eb,#adjbar .eb{display:flex;gap:6px;margin-top:2px}

/* layers */
#layers{position:absolute;top:8px;right:8px;bottom:8px;width:290px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 10px 36px rgba(0,0,0,.5);z-index:5}
#layers header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
#layers h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#lyList{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:4px;touch-action:pan-y}
.ly{display:grid;grid-template-columns:30px 46px 46px minmax(0,1fr);align-items:center;gap:8px;padding:6px;border-radius:10px;background:var(--panel-2)}
.ly.act{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ly.lift{opacity:.85;transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1.5px var(--accent);position:relative;z-index:2;transition:transform .12s}
.ly.dropb{box-shadow:inset 0 -3px 0 var(--accent)} .ly.dropa{box-shadow:inset 0 3px 0 var(--accent)} .ly.dropi{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel-2))}
.ly.grp{background:color-mix(in srgb,var(--panel-2) 70%,#000)}
.ly .fold{width:46px;height:34px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--accent)}
.ly .fold svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.ly .fold .chev{width:12px;height:12px;stroke:var(--muted);stroke-width:2.2;transition:transform .15s}
.ly.col .fold .chev{transform:rotate(-90deg)}
.ly.hid{opacity:.5}
.ly .eye{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ly .eye.off{opacity:.35}
.ly .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.th{width:46px;height:46px;border-radius:6px;background:repeating-conic-gradient(#3b3e44 0 25%,#2e3136 0 50%) 0 0/10px 10px;display:block;object-fit:contain;outline-offset:1px}
.th.sel{outline:2px solid var(--accent)}
.ly .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.ly .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
#lyProps{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.row label{font-size:12px;color:var(--muted);width:78px;flex:none}
.row input[type=text],.row select{flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px}
#lyName[readonly]{cursor:pointer}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.btns button{height:34px;border-radius:8px;background:var(--panel-2);font-size:12px}
.btns button:active{background:var(--line)}
.btns .dg{color:var(--danger)}
.btns button:disabled{opacity:.4}

/* popovers / dialogs */
.pop{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.55);padding:8px}
#menu{top:54px;left:8px;width:250px;display:flex;flex-direction:column}
#menu button{text-align:left;height:40px;padding:0 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
#menu button:active{background:var(--panel-2)}
#menu small{color:var(--muted);font-family:var(--mono);font-size:11px}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
#picker{top:54px;right:8px;width:260px;padding:12px;display:flex;flex-direction:column;gap:10px}
#sv{width:100%;aspect-ratio:1;border-radius:8px;touch-action:none;display:block}
#hue{width:100%;height:22px;border-radius:11px;touch-action:none;display:block}
#recent{display:flex;flex-wrap:wrap;gap:6px}
#recent button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.scrim{position:absolute;inset:0;z-index:30;background:rgba(8,9,11,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 4px;font-size:18px;font-weight:600;text-wrap:balance}
.dlg p{margin:0 0 14px;color:var(--muted)}
.gest{display:grid;grid-template-columns:minmax(0,max-content) 1fr;gap:10px 16px;margin:14px 0}
.gest dt{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:normal;max-width:190px;text-wrap:balance;padding-top:2px}
.gest dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dlg .actions button{height:40px;padding:0 16px;border-radius:10px;background:var(--panel-2)}
.dlg .actions .pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.dlg.narrow{width:min(400px,100%)}
.dlg.wide{width:min(820px,100%)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;max-height:62vh;overflow-y:auto;padding:2px}
.lib .card{position:relative;background:var(--panel-2);border-radius:12px;padding:8px;cursor:pointer;border:1.5px solid transparent}
.lib .card.cur{border-color:var(--accent)}
.lib .card .lth{aspect-ratio:1;border-radius:8px;background:#0c0d0f;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lib .card .lth img{max-width:100%;max-height:100%}
.lib .card .nm{margin-top:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.lib .card .mt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.lib .card .ac{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.lib .card .ac button{width:32px;height:32px;border-radius:8px;background:rgba(20,21,24,.82);font-size:14px}
.lib .card .ac .dg{color:var(--danger)}
.dlg .actions.list{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:14px}
.dlg .actions.list button{height:auto;min-height:52px;padding:9px 14px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;font-size:14px}
.dlg .actions.list button small{color:var(--muted);font-size:11.5px;line-height:1.3}
.dlg .actions.list button:active{background:var(--line)}
.dlg .actions.list .dg{color:var(--danger)}
.dlg .actions.list .close{min-height:44px;margin-top:4px;background:none;border:1px solid var(--line);align-items:center}
.mhead{display:flex;gap:14px;align-items:center}

.mhead .mname{margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}

.presets button{padding:10px;border-radius:10px;background:var(--panel-2);text-align:left}
.presets button.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.presets b{display:block;font-weight:500}
.presets span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dims{display:flex;gap:8px;align-items:center}
.dims input{width:100px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-family:var(--mono)}
#toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:40;background:var(--panel-2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.45);font-size:13px;max-width:calc(100% - 32px);text-align:center}
#busy{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,9,11,.5);font-family:var(--mono);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- polish pass: calmer surfaces, tighter rhythm, one accent ---- */
:root{
  --panel:#1e2025; --panel-2:#292c33; --panel-3:#33373f; --line:#30343b; --line-soft:#272a30;
  --glass:rgba(30,32,37,.88); --shadow:0 14px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
}
body{-webkit-font-smoothing:antialiased}
#top{gap:4px;padding:6px 10px;box-shadow:inset 0 -1px 0 var(--line-soft)}
.tb{transition:background-color .12s,color .12s,box-shadow .12s}
@media (hover:hover){ .tb:hover:not(.on){background:var(--panel-2)} .btns button:hover,.fbar button:hover:not(.pri),#flyout button:hover:not(.on),.pop button:hover{background:var(--panel-3)} .ly:hover:not(.act){background:var(--panel-2)} }
.tb:active:not(.on){background:var(--panel-3)}
.tb.on{box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.pill{display:inline-flex;align-items:center;gap:0;background:var(--panel-2);border-radius:10px;padding:2px;flex:none}
.pill .tb{height:32px;min-width:34px;padding:0 8px;border-radius:8px}
#docName{max-width:200px;color:var(--muted);font-size:13px;gap:4px;padding:0 8px 0 10px}
#docName span{overflow:hidden;text-overflow:ellipsis}
#docName svg{width:14px;height:14px;opacity:.7}
#swatch{width:32px;height:32px;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.seg{border-radius:9px}
.seg button{transition:background-color .12s}
.chk{border-radius:8px}
/* rail */
#rail{gap:6px;padding:10px 6px}
#rail .tb{border-radius:12px}
#rail .tgm::after{right:4px;bottom:4px;border-left-width:4px;border-bottom-width:4px;opacity:.45}
#rail .tb.on.tgm::after{opacity:.6}
.rsep{width:26px;height:1px;background:var(--line);flex:none;margin:4px 0}
.vs{border-radius:14px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
.vs .fill{background:color-mix(in srgb,var(--fg) 22%,transparent);border-radius:14px}
.vs .knob{height:6px;left:-4px;right:-4px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.vlabel{margin-top:2px}
/* glass for floating surfaces */
#layers,.fbar,.pop,#flyout,#toast,.dlg,#optPop{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border-color:var(--line);box-shadow:var(--shadow)}
.scrim{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
/* layers panel */
#layers{width:296px;border-radius:16px}
#layers header{padding:12px 12px 8px 16px}
#layers h2{font-size:12px;display:flex;align-items:baseline;gap:8px}
#layers h2 small{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);opacity:.7}
#lyClose{width:32px;height:32px;min-width:32px;padding:0;color:var(--muted)}
#lyList{padding:2px 8px 8px;gap:2px}
.ly{grid-template-columns:28px 42px 42px minmax(0,1fr);gap:8px;padding:5px 8px 5px 4px;background:transparent;border-radius:10px;transition:background-color .12s}
.ly.act{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ly.grp{background:color-mix(in srgb,var(--panel-2) 55%,transparent)}
.ly.grp.act{background:var(--accent-soft)}
.ly .fold{width:42px}
.th{width:42px;height:42px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.ly .nm{font-size:13.5px;font-weight:500}
.ly .meta{font-size:10.5px;opacity:.85;margin-top:1px}
#lyProps{gap:10px;padding:12px}
.row label{width:84px}
.row input[type=text],.row select{height:34px;border-radius:9px;background:var(--bg);border-color:var(--line);padding:0 10px}
.row select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
#lyOpacV{min-width:34px;text-align:right;margin-left:4px}
.btns{gap:5px}
.btns button{height:34px;border-radius:9px;font-size:12px;white-space:nowrap;background:var(--panel-2);transition:background-color .12s;overflow:hidden;text-overflow:ellipsis;padding:0 2px;letter-spacing:-.01em}
.btns button:active{background:var(--panel-3)}
.btns .dg{color:var(--danger)}
/* floating bars */
.fbar{border-radius:16px;padding:6px;gap:2px;align-items:center}
#selbar .seg button{padding:0 9px}
.fbar button{height:36px;padding:0 9px;font-size:13px;border-radius:10px;transition:background-color .12s}
.fbar button:active:not(.pri){background:var(--panel-3)}
.fbar .pri{box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.fsep{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
.fbar .ai{color:var(--accent)}
/* small things */
#toast{border-radius:12px;padding:9px 16px;font-size:13px}
#status span{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:4px 8px;border-radius:7px}
.pop button{transition:background-color .12s}
#flyout{border-radius:16px}
#flyout button{border-radius:11px}
#flyout button.on{box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
.dlg{border-radius:18px}
.dlg .actions button{border-radius:11px}
#busy{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
svg[data-logo]{clip-path:inset(0 round 22.5%)}
#splash svg[data-logo]{filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}

</style>

<script type="text/plain" id="pmSrc">
// PatchMatch image completion (Wexler-style EM over an image pyramid). Runs inside a Worker.
function inpaint(W, H, rgba, holeMask, opts){
  const R = opts.r || 3, P = 2*R+1;
  const progress = opts.progress || (()=>{});
  // ---- pyramid
  const levels=[]; { let w=W,h=H, img=new Float32Array(W*H*3), m=new Uint8Array(holeMask);
    for (let i=0;i<W*H;i++){ img[i*3]=rgba[i*4]; img[i*3+1]=rgba[i*4+1]; img[i*3+2]=rgba[i*4+2]; }
    levels.push({w,h,img,m});
    while (Math.max(w,h)>opts.minSize){ const nw=Math.max(1,w>>1), nh=Math.max(1,h>>1), ni=new Float32Array(nw*nh*3), nm=new Uint8Array(nw*nh);
      for (let y=0;y<nh;y++) for (let x=0;x<nw;x++){ let s0=0,s1=0,s2=0,c=0,hole=0;
        for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++){ const xx=Math.min(w-1,2*x+dx), yy=Math.min(h-1,2*y+dy), k=yy*w+xx; if (m[k]) hole=1; else { s0+=img[k*3]; s1+=img[k*3+1]; s2+=img[k*3+2]; c++; } }
        const j=y*nw+x; nm[j]=hole; if(c){ ni[j*3]=s0/c; ni[j*3+1]=s1/c; ni[j*3+2]=s2/c; } }
      w=nw; h=nh; img=ni; m=nm; levels.push({w,h,img,m}); } }
  const L=levels.length;
  // ---- coarsest: onion-peel fill
  { const {w,h,img,m}=levels[L-1]; const known=new Uint8Array(w*h); for(let i=0;i<w*h;i++) known[i]=m[i]?0:1;
    let left=0; for(let i=0;i<w*h;i++) if(!known[i]) left++;
    while(left>0){ const add=[]; for (let y=0;y<h;y++) for(let x=0;x<w;x++){ const k=y*w+x; if(known[k]) continue; let s0=0,s1=0,s2=0,c=0;
        for (let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx<0||yy<0||xx>=w||yy>=h) continue; const q=yy*w+xx; if(known[q]){ s0+=img[q*3]; s1+=img[q*3+1]; s2+=img[q*3+2]; c++; } }
        if(c) add.push(k,s0/c,s1/c,s2/c); }
      if(!add.length) break; for(let i=0;i<add.length;i+=4){ const k=add[i]; img[k*3]=add[i+1]; img[k*3+1]=add[i+2]; img[k*3+2]=add[i+3]; known[k]=1; left--; } } }
  let nnx=null, nny=null, prevW=0;
  let rnd=12345; const rand=()=>{ rnd^=rnd<<13; rnd^=rnd>>>17; rnd^=rnd<<5; return (rnd>>>0)/4294967296; };
  for (let li=L-1; li>=0; li--){
    const {w,h,img,m}=levels[li];
    // valid source centres: patch fully inside and touching no hole pixel (summed-area table of the mask)
    const sat=new Int32Array((w+1)*(h+1)); for(let y=0;y<h;y++){ let row=0; for(let x=0;x<w;x++){ row+=m[y*w+x]; sat[(y+1)*(w+1)+x+1]=sat[y*(w+1)+x+1]+row; } }
    const holeIn=(x0,y0,x1,y1)=>sat[y1*(w+1)+x1]-sat[y0*(w+1)+x1]-sat[y1*(w+1)+x0]+sat[y0*(w+1)+x0];
    const valid=new Uint8Array(w*h); const vlist=[];
    for (let y=R;y<h-R;y++) for(let x=R;x<w-R;x++){ if(!holeIn(x-R,y-R,x+R+1,y+R+1)){ valid[y*w+x]=1; vlist.push(y*w+x); } }
    if (!vlist.length) continue;
    // targets: centres whose patch touches the hole
    const tgt=[]; for (let y=0;y<h;y++) for(let x=0;x<w;x++){ const x0=Math.max(0,x-R), y0=Math.max(0,y-R), x1=Math.min(w,x+R+1), y1=Math.min(h,y+R+1); if(holeIn(x0,y0,x1,y1)) tgt.push(y*w+x); }
    const NX=new Int32Array(w*h).fill(-1), NY=new Int32Array(w*h).fill(-1), ND=new Float32Array(w*h).fill(Infinity);
    const dist=(cx,cy,sx,sy,best)=>{ let d=0; for(let dy=-R;dy<=R;dy++){ const ty=cy+dy; if(ty<0||ty>=h) continue; const sy2=sy+dy;
        for(let dx=-R;dx<=R;dx++){ const tx=cx+dx; if(tx<0||tx>=w) continue; const a=(ty*w+tx)*3, b=(sy2*w+sx+dx)*3;
          const e0=img[a]-img[b], e1=img[a+1]-img[b+1], e2=img[a+2]-img[b+2]; d+=e0*e0+e1*e1+e2*e2; } if(d>=best) return d; } return d; };
    const tryS=(k,cx,cy,sx,sy)=>{ if(sx<R||sy<R||sx>=w-R||sy>=h-R) return; const s=sy*w+sx; if(!valid[s]) return; if(Math.abs(sx-cx)<=R && Math.abs(sy-cy)<=R && m[k]) return;
      const d=dist(cx,cy,sx,sy,ND[k]); if(d<ND[k]){ ND[k]=d; NX[k]=sx; NY[k]=sy; } };
    // init NNF: from coarser level if any, else random
    for (const k of tgt){ const x=k%w, y=(k/w)|0;
      if (nnx && prevW){ const pk=(y>>1)*prevW+(x>>1); const px=nnx[pk], py=nny[pk]; if(px>=0) tryS(k,x,y,px*2+(x&1),py*2+(y&1)); }
      if (NX[k]<0){ for(let t=0;t<4;t++){ const s=vlist[(rand()*vlist.length)|0]; tryS(k,x,y,s%w,(s/w)|0); } } }
    const em = li===L-1 ? opts.itCoarse : (li===0 ? opts.itFine : opts.itMid);
    const acc=new Float32Array(w*h*4);
    for (let it=0; it<em; it++){
      // PatchMatch passes
      for (let pass=0; pass<2; pass++){ const fwd=(pass+it)%2===0, dd=fwd?1:-1;
        for (let ii=0; ii<tgt.length; ii++){ const k=tgt[fwd?ii:tgt.length-1-ii], x=k%w, y=(k/w)|0;
          const lx=x-dd, ly=y-dd;
          if (lx>=0&&lx<w){ const q=y*w+lx; if(NX[q]>=0) tryS(k,x,y,NX[q]+dd,NY[q]); }
          if (ly>=0&&ly<h){ const q=ly*w+x; if(NX[q]>=0) tryS(k,x,y,NX[q],NY[q]+dd); }
          let rad=Math.max(w,h); const bx=NX[k], by=NY[k];
          while(rad>=1 && bx>=0){ tryS(k,x,y,(bx+(rand()*2-1)*rad)|0,(by+(rand()*2-1)*rad)|0); rad>>=1; }
          if (NX[k]<0){ const s=vlist[(rand()*vlist.length)|0]; tryS(k,x,y,s%w,(s/w)|0); } } }
      // voting: hole pixels become the weighted mean of the patches covering them
      acc.fill(0); let sigma=0, n=0; for(const k of tgt){ if(ND[k]<Infinity){ sigma+=ND[k]; n++; } } sigma=Math.max(1,(sigma/Math.max(1,n))*(opts.sig||0.75));
      for (const k of tgt){ if(NX[k]<0) continue; const x=k%w, y=(k/w)|0, wt=Math.exp(-ND[k]/(2*sigma))+1e-6;
        for(let dy=-R;dy<=R;dy++){ const ty=y+dy; if(ty<0||ty>=h) continue; for(let dx=-R;dx<=R;dx++){ const tx=x+dx; if(tx<0||tx>=w) continue; const t=ty*w+tx; if(!m[t]) continue;
          const s=((NY[k]+dy)*w+NX[k]+dx)*3; acc[t*4]+=img[s]*wt; acc[t*4+1]+=img[s+1]*wt; acc[t*4+2]+=img[s+2]*wt; acc[t*4+3]+=wt; } } }
      for (let t=0;t<w*h;t++){ if(m[t] && acc[t*4+3]>0){ img[t*3]=acc[t*4]/acc[t*4+3]; img[t*3+1]=acc[t*4+1]/acc[t*4+3]; img[t*3+2]=acc[t*4+2]/acc[t*4+3]; } }
      for (const k of tgt) ND[k]=Infinity; for (const k of tgt){ const x=k%w,y=(k/w)|0; if(NX[k]>=0){ const sx=NX[k],sy=NY[k]; NX[k]=-1; tryS(k,x,y,sx,sy); } }
    }
    // upsample the filled hole into the next finer level as its starting guess
    if (li>0){ const f=levels[li-1]; for(let y=0;y<f.h;y++) for(let x=0;x<f.w;x++){ const k=y*f.w+x; if(!f.m[k]) continue; const c=Math.min(h-1,y>>1)*w+Math.min(w-1,x>>1); f.img[k*3]=img[c*3]; f.img[k*3+1]=img[c*3+1]; f.img[k*3+2]=img[c*3+2]; } }
    nnx=NX; nny=NY; prevW=w;
    progress((L-li)/L);
  }
  const out=new Uint8ClampedArray(W*H*4), img=levels[0].img;
  for (let i=0;i<W*H;i++){ out[i*4]=img[i*3]; out[i*4+1]=img[i*3+1]; out[i*4+2]=img[i*3+2]; out[i*4+3]=255; }
  return out;
}
if (typeof self!=='undefined' && typeof window==='undefined'){
  self.onmessage=e=>{ const {W,H,rgba,mask,opts}=e.data; const out=inpaint(W,H,rgba,mask,{...opts, progress:p=>self.postMessage({progress:p})}); self.postMessage({done:true,out},[out.buffer]); };
}
if (typeof module!=='undefined') module.exports={inpaint};

</script>

const BLENDS = [
  ['source-over','Обычный','normal'],['multiply','Умножение','multiply'],['screen','Экран','screen'],

/* ============ selection ============ */

  const tx0=Math.max(0,Math.floor(x0/FX_TILE)), ty0=Math.max(0,Math.floor(y0/FX_TILE)), tx1=Math.min(Math.ceil(doc.w/FX_TILE)-1,Math.floor(x1/FX_TILE)), ty1=Math.min(Math.ceil(doc.h/FX_TILE)-1,Math.floor(y1/FX_TILE));

}
function fxTile(c, x, y){

  const src = c.all ? ctx2(compositeRegion(rr,W,H),{willReadFrequently:true}).getImageData(0,0,W,H) : ctx2(c.layer.canvas,{willReadFrequently:true}).getImageData(rr.x,rr.y,W,H), d=src.data;

/* smudge (finger): each dab lays down the paint it carries, then picks up what is under it.

  const keep = c.started ? Math.pow(0.1, 1/(11*(0.15 + S.smudge*3*a))) : 0; // dabs are ~0.09 d apart

    for (let i=0;i<W;i++){ const px=x0+i+0.5, t=Math.hypot(px-x,py-y)/r; if (t>=1) continue;

      const u=Math.min(cs-1,Math.max(0,((px-(x-r))/dd*cs)|0)), q=(v*cs+u)*4, k=(j*W+i)*4;

function marchingSegs(a, W, H, thr, sx, sy){ // outline of mask a (W×H, 0..255) as segments in doc coords

    const tl=v(x,y)>thr, tr=v(x+1,y)>thr, br=v(x+1,y+1)>thr, bl=v(x,y+1)>thr;

async function selectSubject(){

    if (err.message==='cancel'){ toast('Загрузка модели отменена. Скачанные части сохранятся'); return; }
    if (err.message==='stall' || /fetch|http|network|Load failed/i.test(err.message)) toast('Модель не скачалась: соединение оборвалось или очень медленное. Попробуй ещё раз, скачанные части сохранятся.',6000);
    else toast('Модель выделения не запустилась в этом окне ('+(err.message||'ошибка')+'). Сработает, когда Проявка будет жить на ПК.',6000);
    return; }

    for (let i=0,j=0;i<N*N;i++,j+=4){ inp[i]=px[j]/255-.5; inp[i+N*N]=px[j+1]/255-.5; inp[i+2*N*N]=px[j+2]/255-.5; }

    const y=res[sess.outputNames[0]].data; let mn=Infinity,mx=-Infinity; for(let i=0;i<N*N;i++){ if(y[i]<mn)mn=y[i]; if(y[i]>mx)mx=y[i]; }

    const full=mk(doc.w,doc.h), fx=ctx2(full); fx.imageSmoothingQuality='high'; fx.drawImage(mc,0,0,doc.w,doc.h);

/* ============ content-aware fill (PatchMatch in a worker, result on a new layer) ============ */
let pmWorkerURL=null;

function compositeRegion(r, cw, ch){
  const c=mk(cw,ch), x=ctx2(c,{willReadFrequently:true}); x.imageSmoothingQuality='high';
  composeTree(x, (x,L)=>{ let src=L.canvas;
    if (L.mask&&L.mask.enabled){ const t=mk(r.w,r.h), tx=ctx2(t); tx.drawImage(L.canvas,r.x,r.y,r.w,r.h,0,0,r.w,r.h); tx.globalCompositeOperation='destination-in'; tx.drawImage(L.mask.canvas,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
      x.globalAlpha=L.opacity; x.globalCompositeOperation=L.blend; x.drawImage(t,0,0,cw,ch); return; }
    x.globalAlpha=L.opacity; x.globalCompositeOperation=L.blend; x.drawImage(src,r.x,r.y,r.w,r.h,0,0,cw,ch); }, {map:(c,cv)=>c.drawImage(cv,r.x,r.y,r.w,r.h,0,0,cw,ch)});

async function contentAwareFill(){

  const mg=Math.max(64, Math.round(Math.max(b.w,b.h)*0.6));
  const r=clipRect(b.x-mg, b.y-mg, b.w+2*mg, b.h+2*mg);

  busy(true,'Заливаю с учётом содержимого…'); await nextFrame();

  const mc=mk(cw,ch), mx=ctx2(mc,{willReadFrequently:true}); mx.drawImage(sel.mask,r.x,r.y,r.w,r.h,0,0,cw,ch);
  const ma=mx.getImageData(0,0,cw,ch).data; let hole=new Uint8Array(cw*ch); for(let i=0;i<cw*ch;i++) hole[i]=ma[i*4+3]>100?1:0;

  for (let x=0;x<cw;x++){ let run=-1e9; for(let y=0;y<ch;y++){ if(tmp[y*cw+x]) run=y; if(y-run<=rd) hole[y*cw+x]=1; } run=1e9; for(let y=ch-1;y>=0;y--){ if(tmp[y*cw+x]) run=y; if(run-y<=rd) hole[y*cw+x]=1; } }

/* ============ transform ============ */

  }

  xf = { layer:L, target, float, fromSel, selMask, orig:r, placed:!!opts.float, onCancel:opts.onCancel, maskParts,

function beginGroupTransform(opts){

/* vertical sliders */
function vslider(el, get, set, label){
  const fill=el.querySelector('.fill'), knob=el.querySelector('.knob');
  const draw=()=>{ const v=get(); fill.style.height=(v*100)+'%'; knob.style.bottom=(v*100)+'%'; label(); };
  let active=false;
  const at=e=>{ const r=el.getBoundingClientRect(); set(clamp(1-(e.clientY-r.top)/r.height,0,1)); draw(); };
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); active=true; try{el.setPointerCapture(e.pointerId);}catch(_){} at(e); });
  el.addEventListener('pointermove',e=>{ if(active) at(e); });
  el.addEventListener('pointerup',()=>{ active=false; savePrefs(); });
  el.addEventListener('pointercancel',()=>{ active=false; });
  return draw;
}
const SIZE_MAX=1000;
const sizeToV = s => Math.pow((s-1)/(SIZE_MAX-1),1/2.2), vToSize = v => Math.max(1,Math.round(1+(SIZE_MAX-1)*Math.pow(v,2.2)));
const drawSize = vslider($('#vsSize'), ()=>sizeToV(curSize()), v=>{ const s=vToSize(v); if(S.tool==='eraser') S.eraserSize=s; else S.size=s; spriteKey=''; },
  ()=>{ $('#lSize').textContent=curSize(); hover=hover||null; renderOverlay(); });

/* ============ colour picker ============ */
let hsv=[0,0,0.2]; const recent=[];
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0; if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; } return [h, mx?d/mx:0, mx]; }
function hsvToHex(h,s,v){ const f=n=>{ const k=(n+h/60)%6; return v-v*s*Math.max(0,Math.min(k,4-k,1)); }; return '#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join(''); }
function setColor(hex, fromPicker){
  S.color=hex.toLowerCase(); $('#swatch').style.background=S.color; spriteKey='';
  if(!fromPicker){ hsv=rgbToHsv(...hexToRgb(S.color)); }
  if(!$('#picker').hidden) drawPicker();
  savePrefs();
}
function pushRecent(c){ const i=recent.indexOf(c); if(i>=0) recent.splice(i,1); recent.unshift(c); recent.length=Math.min(recent.length,16); }
function drawPicker(){
  const sv=$('#sv'), x=ctx2(sv), W=sv.width, H=sv.height;
  x.fillStyle=hsvToHex(hsv[0],1,1); x.fillRect(0,0,W,H);
  let g=x.createLinearGradient(0,0,W,0); g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,W,H);
  g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'#000'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.beginPath(); x.arc(hsv[1]*W,(1-hsv[2])*H,8,0,7); x.strokeStyle='#fff'; x.lineWidth=2.5; x.stroke(); x.strokeStyle='#000'; x.lineWidth=1; x.stroke();
  const hc=$('#hue'), hx=ctx2(hc); const hg=hx.createLinearGradient(0,0,hc.width,0);
  for(let i=0;i<=6;i++) hg.addColorStop(i/6, hsvToHex(i*60,1,1)); hx.fillStyle=hg; hx.fillRect(0,0,hc.width,hc.height);
  const hp=hsv[0]/360*hc.width; hx.fillStyle='#fff'; hx.fillRect(hp-2,0,4,hc.height); hx.strokeStyle='#000'; hx.strokeRect(hp-2.5,0.5,5,hc.height-1);
  $('#hex').value=S.color;
  const r=$('#recent'); r.textContent=''; for(const c of recent){ const b=document.createElement('button'); b.style.background=c; b.setAttribute('aria-label',c); b.onclick=()=>setColor(c); r.append(b); }
}
function dragOn(el, fn){ let on=false; el.addEventListener('pointerdown',e=>{on=true; el.setPointerCapture(e.pointerId); fn(e);}); el.addEventListener('pointermove',e=>{ if(on) fn(e); }); el.addEventListener('pointerup',()=>{on=false; pushRecent(S.color);}); }
dragOn($('#sv'), e=>{ const r=$('#sv').getBoundingClientRect(); hsv[1]=clamp((e.clientX-r.left)/r.width,0,1); hsv[2]=clamp(1-(e.clientY-r.top)/r.height,0,1); setColor(hsvToHex(...hsv),true); });
dragOn($('#hue'), e=>{ const r=$('#hue').getBoundingClientRect(); hsv[0]=clamp((e.clientX-r.left)/r.width,0,0.9999)*360; setColor(hsvToHex(...hsv),true); });
$('#hex').addEventListener('change',e=>{ let v=e.target.value.trim(); if(!v.startsWith('#')) v='#'+v; if(/^#[0-9a-f]{6}$/i.test(v)){ setColor(v); pushRecent(S.color); drawPicker(); } else toast('Нужен формат #RRGGBB'); });
$('#swatch').onclick=e=>{ e.stopPropagation(); closePops('picker'); const p=$('#picker'); p.hidden=!p.hidden; if(!p.hidden){ hsv=rgbToHsv(...hexToRgb(S.color)); drawPicker(); } };
function closePops(except){ for(const id of ['menu','picker','flyout']) if(id!==except) $('#'+id).hidden=true; }
$('#bMenu').onclick=e=>{ e.stopPropagation(); closePops('menu'); $('#menu').hidden=!$('#menu').hidden; };
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.pop,#swatch,#bMenu,.tgm')) closePops(); },true);

function dialog(html, buttons, opt={}){
  const s=document.createElement('div'); s.className='scrim'; const d=document.createElement('div'); d.className='dlg'+(opt.list?' narrow':''); d.innerHTML=html;
  const a=document.createElement('div'); a.className='actions'+(opt.list?' list':'');
  for (const [label,fn,pri,desc] of buttons){ const b=document.createElement('button'); b.textContent=label; if(pri) b.className=pri===true?'pri':pri;
    if (desc){ const sm=document.createElement('small'); sm.textContent=desc; b.append(sm); } b.onclick=()=>{ const keep = fn && fn(d)===false; if(!keep) s.remove(); }; a.append(b); }
  d.append(a); s.append(d); s.addEventListener('pointerdown',e=>{ if(e.target===s) s.remove(); }); $('#app').append(s); return d;
}

async function openPsd(f){
  if (!window.agPsd) throw new Error('Библиотека PSD не загрузилась');
  const buf=await f.arrayBuffer();
  const psd=agPsd.readPsd(buf,{skipThumbnail:true,skipCompositeImageData:false});
  createDoc(psd.width, psd.height, f.name.replace(/\.psd$/i,''));
  const layers=[];
  (function walk(ch, P){ for(const c of ch||[]){
    if(c.children){ const G=newGroup(c.name||'Группа'); G.visible=!c.hidden; G.opacity=c.opacity??1; G.blend=c.blendMode==='pass through'?'pass':psdToBlend(c.blendMode||'normal'); G.collapsed=!c.opened; G.parent=P;
      if (c.mask && c.mask.canvas) G.mask=psdMask(c.mask, G); walk(c.children, G); layers.push(G); }
    else { c.__parent=P; layers.push(c); } } })(psd.children, null);
  if (!layers.some(x=>!isGroup(x)) && psd.canvas){ doc.layers[0].ctx.clearRect(0,0,doc.w,doc.h); doc.layers[0].ctx.drawImage(psd.canvas,0,0); doc.layers.length=1; doc.active=0; return; }
  doc.layers=[];
  for (const c of layers){
    if (isGroup(c)){ doc.layers.push(c); continue; }
    const aj = c.adjustment && adjNormalize(c.adjustment);
    if (aj){ const A=newAdj(ADJ_FROM_PSD[c.adjustment.type], c.name); A.adj=aj; A.clip=!!c.clipping; A.parent=c.__parent; A.visible=!c.hidden; A.opacity=c.opacity??1;
      if (c.mask && c.mask.canvas) A.mask=psdMask(c.mask, A); doc.layers.push(A); continue; }
    const L=newLayer(c.name||'Слой'); L.parent=c.__parent;
    if (c.canvas) L.ctx.drawImage(c.canvas, c.left||0, c.top||0);
    L.visible=!c.hidden; L.opacity=c.opacity??1; L.blend=psdToBlend(c.blendMode||'normal');
    if (c.mask && c.mask.canvas) L.mask=psdMask(c.mask, L);
    doc.layers.push(L);
    await nextFrame();
  }
  doc.active=doc.layers.length-1; clearHistory();
}
function psdMask(cm, owner){
  const m=newMask(owner), mx=m.ctx, def=(cm.defaultColor??255);
  mx.clearRect(0,0,doc.w,doc.h); if(def>0){ mx.fillStyle=`rgba(255,255,255,${def/255})`; mx.fillRect(0,0,doc.w,doc.h); }
  const mc=cm.canvas, g=ctx2(mc).getImageData(0,0,mc.width,mc.height), d=g.data;
  for(let i=0;i<d.length;i+=4){ const v=d[i]; d[i]=d[i+1]=d[i+2]=255; d[i+3]=v; }
  const tmp=mk(mc.width,mc.height); ctx2(tmp).putImageData(g,0,0);
  mx.clearRect(cm.left||0,cm.top||0,mc.width,mc.height); mx.drawImage(tmp,cm.left||0,cm.top||0);
  m.enabled=!cm.disabled; return m;
}

const nativeApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.proyavka);
async function nativeSave(name, data){
  const h=window.webkit.messageHandlers.proyavka, blob = data instanceof Blob ? data : new Blob([data]);
  h.postMessage({op:'begin', name});
  const step=3*1024*1024;
  for (let o=0; o<blob.size; o+=step){
    const buf=new Uint8Array(await blob.slice(o, o+step).arrayBuffer()); let bin='';
    for (let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+0x8000));
    h.postMessage({op:'chunk', b64:btoa(bin)});
  }
  h.postMessage({op:'end'});
}

async function saveFile(name, data){
  if (nativeApp){ try{ await nativeSave(name, data); }catch(e){ console.error(e); toast('Не удалось передать файл'); } return; }
  await dlReady;
  if (!dl){
    const blob = data instanceof Blob ? data : new Blob([data]);
    const file = new File([blob], name, {type: blob.type || 'application/octet-stream'});
    try{ if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); toast('Готово: '+name); return; } }
    catch(e){ if (e && e.name==='AbortError'){ toast('Сохранение отменено'); return; } }
    const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
    toast('Сохранено: '+name); return;
  }
  try{ await dl.save({filename:name, data}); toast('Сохранено: '+name); }
  catch(e){ if(e&&e.code==='declined') toast('Сохранение отменено'); else toast('Не сохранилось: '+(e&&e.message||'ошибка'),4000); }
}
async function exportImg(kind){
  busy(true,'Собираю файл…'); await nextFrame();

    if (kind==='psd'){
      if(!window.agPsd||!window.fflate) throw new Error('Библиотеки PSD не загрузились');
      const build=P=>kidsOf(P).map(L=>{
        const o = isGroup(L) ? {name:L.name, opacity:L.opacity, hidden:!L.visible, blendMode:L.blend==='pass'?'pass through':blendToPsd(L.blend), opened:!L.collapsed, children:build(L)}
                : L.kind==='adj' ? {name:L.name, opacity:L.opacity, hidden:!L.visible, blendMode:'normal', clipping:!!L.clip, adjustment:JSON.parse(JSON.stringify(L.adj))}
                             : {name:L.name, canvas:L.canvas, left:0, top:0, opacity:L.opacity, hidden:!L.visible, blendMode:blendToPsd(L.blend)};
        if (L.mask){ const m=mk(doc.w,doc.h), mx=ctx2(m); mx.fillStyle='#000'; mx.fillRect(0,0,doc.w,doc.h); mx.drawImage(L.mask.canvas,0,0); o.mask={canvas:m,left:0,top:0,defaultColor:0,disabled:!L.mask.enabled}; }
        return o; });
      const children=build(null);
      const buf=agPsd.writePsd({width:doc.w,height:doc.h,children,canvas:flatten(1)},{generateThumbnail:false});
      busy(false);

      const zip=fflate.zipSync({[safeName()+'.psd']:new Uint8Array(buf)},{level:0});
      await saveFile(safeName()+'.psd.zip', new Blob([zip]));

}

function flipFix(){ // keep scales positive by flipping pixels instead
  const f=xf.float, c=mk(f.width,f.height), x=ctx2(c);
  if (xf.sx<0){ x.translate(f.width,0); x.scale(-1,1); xf.sx*=-1; } else { x.translate(0,f.height); x.scale(1,-1); xf.sy*=-1; }
  x.drawImage(f,0,0);
  for (const mp of [xf.parts, xf.maskParts]) if (mp) for (const [PL,pf] of mp){ const c2=mk(pf.width,pf.height), x2=ctx2(c2); x2.setTransform(x.getTransform()); x2.drawImage(pf,0,0); mp.set(PL,c2); }
  xf.float=c; requestRender();
}

function startPinch(){
  const [a,b]=[...touches.values()];
  gesture.start={ c:[(a.x+b.x)/2,(a.y+b.y)/2], d:Math.hypot(b.x-a.x,b.y-a.y)||1, ang:Math.atan2(b.y-a.y,b.x-a.x), v:{...view} };

}
function doPinch(){ navStart();

  const c=[(a.x+b.x)/2,(a.y+b.y)/2], d=Math.hypot(b.x-a.x,b.y-a.y)||1, ang=Math.atan2(b.y-a.y,b.x-a.x);

  view={ s, r, x:c[0]-(cs*dx-sn*dy), y:c[1]-(sn*dx+cs*dy) };

/* one-time move from the old single slot (meta, c<id>, m<id>) into the library; leftover layers of earlier documents are rescued as "Найдено" documents */
async function migrateStorage(){

  const all=await idbAll(), lib=[], puts={}, dels=[];
  const meta=all.get('meta'), used=new Set();
  if (meta && meta.layers && meta.layers.length){
    const id=newDocId(), P=PFX(id), keys=[];
    for (const l of meta.layers){ for (const k of ['c'+l.id,'m'+l.id]) if (all.has(k)){ puts[P+k]=all.get(k); keys.push(k); used.add(k); } }
    puts[P+'meta']=Object.assign({}, meta, {keys});
    lib.push({id, name:meta.name||'Без названия', w:meta.w, h:meta.h, t:meta.t||Date.now(), n:meta.layers.filter(l=>l.kind!=='group').length});
    setCurDoc(id); dels.push('meta');
  }
  // orphans: layer pictures no document points to any more
  const orphans=[...all.keys()].filter(k=>typeof k==='string' && /^c\d+$/.test(k) && !used.has(k)).map(k=>+k.slice(1)).sort((a,b)=>a-b);
  const groups=[];
  for (const n of orphans){
    let w=0,h=0; try{ const im=await createImageBitmap(all.get('c'+n)); w=im.width; h=im.height; im.close&&im.close(); }catch(_){ continue; }
    const g=groups[groups.length-1]; if (g && g.w===w && g.h===h) g.ids.push(n); else groups.push({w,h,ids:[n]});
  }
  let num=0;
  for (const g of groups){
    const id=newDocId()+(num++), P=PFX(id), keys=[], layers=[];
    for (const n of g.ids){ puts[P+'c'+n]=all.get('c'+n); keys.push('c'+n);
      const hasM=all.has('m'+n); if (hasM){ puts[P+'m'+n]=all.get('m'+n); keys.push('m'+n); }
      layers.push({id:n, kind:'layer', name:'Слой '+(layers.length+1), visible:true, opacity:1, blend:'source-over', parent:null, mask:hasM?{enabled:true}:null}); }
    const name='Найдено '+num+' · '+g.w+'×'+g.h;
    puts[P+'meta']={w:g.w,h:g.h,name,active:layers.length-1,uid:Math.max(...g.ids)+1,keys,layers,t:Date.now()-num};
    lib.push({id,name,w:g.w,h:g.h,t:Date.now()-1000*num,n:layers.length});
  }

}

    const puts={}; let lib=null;
    for (const [name,u8] of Object.entries(un)){
      if (name.startsWith('b/')){ const k=decodeURIComponent(name.slice(2)); puts[k]=new Blob([u8],{type: k.endsWith(':thumb')?'image/jpeg':'image/png'}); }
      else if (name.startsWith('j/')){ const k=decodeURIComponent(name.slice(2)), v=JSON.parse(fflate.strFromU8(u8)); if (k==='library') lib=v; else puts[k]=v; }
    }
    const cur=await libGet(), merged=[...(lib||[])]; for (const e of cur) if (!merged.some(x=>x.id===e.id)) merged.push(e);
    puts.library=merged.sort((a,b)=>b.t-a.t);
    await idbTx(puts); busy(false); toast(`Восстановлено документов: ${(lib||[]).length}`,3000); openLibrary();
  }catch(err){ console.error(err); busy(false); toast('Не получилось: '+(err.message||'ошибка'),4000); }
});
async function openLibrary(){
  if (xf){ toast('Сначала примени или отмени трансформ'); return; }
  busy(true,'Сохраняю…'); await flushSave(); busy(false);
  const lib=(await libGet()).sort((a,b)=>b.t-a.t), urls=[];
  let usage=''; try{ const e=await navigator.storage.estimate(); usage=' · занято '+Math.round(e.usage/1048576)+' МБ'; }catch(_){}
  const d=dialog(`<h3>Мои документы</h3><p>${lib.length} шт.${usage}. Всё сохраняется само; тап по карточке — открыть.</p><div class="lib"></div>`, [['Новый документ', ()=>{ setTimeout(newDocDialog,0); }], ['Закрыть', null, true]]);
  d.classList.add('wide');
  const box=d.querySelector('.lib');
  if (!lib.length) box.innerHTML='<p style="grid-column:1/-1">Пока пусто. Документ появится здесь после первой правки.</p>';
  for (const e of lib){
    const c=document.createElement('div'); c.className='card'+(doc&&doc.id===e.id?' cur':'');
    c.innerHTML=`<div class="lth"></div><div class="nm"></div><div class="mt"></div><div class="ac"><button data-a="ren" aria-label="Переименовать">✎</button><button data-a="del" aria-label="Удалить" class="dg">✕</button></div>`;
    c.querySelector('.nm').textContent=e.name; c.querySelector('.mt').textContent=`${e.w}×${e.h} · ${e.n||'?'} сл. · ${fmtWhen(e.t)}${doc&&doc.id===e.id?' · открыт':''}`;
    (async()=>{ let b=await idbGet(PFX(e.id)+'thumb');
      if (!b){ const m=await idbGet(PFX(e.id)+'meta'); const k=m&&(m.keys||[]).filter(k=>k[0]==='c').pop(); if(k) b=await idbGet(PFX(e.id)+k); }
      if(!b) return; const u=URL.createObjectURL(b); urls.push(u); const im=new Image(); im.src=u; c.querySelector('.lth').append(im); })();
    c.onclick=async ev=>{ const a=ev.target.closest('[data-a]')?.dataset.a;
      if (a==='del'){ ev.stopPropagation();
        dialog(`<h3>Удалить «${escapeHtml(e.name)}»?</h3><p>Документ пропадёт из памяти iPad насовсем. Это не отменить.</p>`, [['Отмена',null],['Удалить', ()=>{ (async()=>{ await deleteDoc(e.id); c.remove(); toast('Удалено'); })(); }, 'pri']]); return; }
      if (a==='ren'){ ev.stopPropagation();
        const dd=dialog(`<h3>Название</h3><div class="dims"><input id="rn" value="${escapeHtml(e.name)}" style="width:100%"></div>`, [['Отмена',null],['Сохранить', x=>{ const v=x.querySelector('#rn').value.trim()||e.name; (async()=>{ await renameDoc(e.id,v); e.name=v; c.querySelector('.nm').textContent=v; })(); }, true]]);
        setTimeout(()=>dd.querySelector('#rn').focus(),50); return; }
      if (doc && doc.id===e.id){ d.closest('.scrim').remove(); return; }
      d.closest('.scrim').remove(); urls.forEach(URL.revokeObjectURL);
      try{ localStorage.setItem('proyavka.booting','1'); }catch(_){}
      const ok=await restore(e.id);
      try{ localStorage.removeItem('proyavka.booting'); }catch(_){}
      if (!ok){ toast('Документ не открылся',3000); if(!doc) createDoc(3000,4000,'Без названия'); }
    };
    box.append(c);
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden && dirtyDoc){ clearTimeout(saveT); autosave(true); } });

const APP_VERSION='2026-10-02 · №26 корректирующие слои'; $('#appVer').textContent=APP_VERSION;
/* ============ storage diagnostics ============ */
let visit={ls:'—', idb:'—'};
(async()=>{
  try{ const n=(+localStorage.getItem('proyavka.visits')||0)+1; localStorage.setItem('proyavka.visits',n); visit.ls=n; }catch(e){ visit.ls='нет доступа'; }
  try{ const d=await mdb(); const cur=await new Promise(r=>{ const q=d.transaction('m').objectStore('m').get('__visits'); q.onsuccess=()=>r(q.result||0); q.onerror=()=>r(0); });
       await mdbPut('__visits', cur+1); visit.idb=cur+1; }catch(e){ visit.idb='нет доступа'; }
})();
async function storeReport(){
  const rows=[];
  rows.push(['Адрес страницы', location.origin]);
  rows.push(['Открытий (localStorage)', String(visit.ls)]);
  rows.push(['Открытий (IndexedDB)', String(visit.idb)]);
  try{ const e=await navigator.storage.estimate(); rows.push(['Место', `${Math.round(e.usage/1048576)} МБ занято из ${Math.round(e.quota/1048576)} МБ`]); }catch(_){ rows.push(['Место','не сообщается']); }
  try{ rows.push(['Постоянное хранение', (navigator.storage&&navigator.storage.persisted) ? ((await navigator.storage.persisted())?'да':'нет') : 'не поддерживается']); }catch(_){ }
  const all=[...MODELS.runtime,...MODELS.isnet,...MODELS.sam_enc,...MODELS.sam_dec]; let have=0;
  for (const f of all){ if (await mdbGet(f[0])) have++; }
  rows.push(['Частей моделей сохранено', `${have} из ${all.length}`]);
  try{ rows.push(['Документов в памяти', String((await libGet()).length)]); }catch(_){ rows.push(['Документов в памяти','нет доступа']); }
  try{ const tr=JSON.parse(localStorage.getItem('proyavka.trail')||'[]'); if(tr.length) rows.push(['Последние перезапуски', tr.slice(-5).join('\n')]); }catch(_){}
  for (const [k,t] of [['proyavka.errors','Последние ошибки'],['proyavka.boot','Этапы запуска']]){ try{ const a=JSON.parse(localStorage.getItem(k)||'[]'); if(a.length) rows.push([t, a.slice(-6).join('\n')]); }catch(_){} }
  rows.push(['Сейчас в памяти документа', '≈'+(doc?memMB():0)+' МБ']);
  dialog(`<h3>Проверка памяти</h3><p>Открой это окно, закрой Проявку, открой снова и загляни сюда ещё раз. Если счётчик открытий опять 1 — Safari стирает память этой страницы при закрытии.</p>
    <dl class="gest">${rows.map(r=>`<dt>${escapeHtml(r[0])}</dt><dd>${escapeHtml(r[1])}</dd>`).join('')}</dl>`, [['Закрыть',null,true]]);
}

/* ============ boot ============ */
/* restart detector: if the page comes back while the previous run never said goodbye, Safari closed it (almost always memory) */
function memNote(s){ try{ const a=JSON.parse(localStorage.getItem('proyavka.trail')||'[]'); a.push(new Date().toLocaleTimeString('ru-RU')+' '+s); while(a.length>25) a.shift(); localStorage.setItem('proyavka.trail', JSON.stringify(a)); }catch(_){} }
function crumb(){ try{ sessionStorage.setItem('proyavka.alive', JSON.stringify({t:Date.now(), tool:S.tool, mem:doc?memMB():0, size:doc?doc.w+'×'+doc.h:'', layers:doc?doc.layers.length:0, ai:!!ML.w, sam:!!samEnc})); }catch(_){} }
setInterval(crumb, 2000);
window.addEventListener('pagehide', ()=>{ try{ sessionStorage.removeItem('proyavka.alive'); }catch(_){} });
let crashedBefore=null; try{ crashedBefore=JSON.parse(sessionStorage.getItem('proyavka.alive')||'null'); }catch(_){}
if (crashedBefore){ const c=crashedBefore; memNote(`перезапуск · инструмент ${c.tool} · документ ≈${c.mem} МБ · ${c.size} · слоёв ${c.layers}${c.ai?' · нейросети были открыты':''}`); }
(async function boot(){
  pvLog('скрипт загружен');
  loadPrefs(); $('#mFinger').textContent=S.fingerDraw?'вкл':'выкл'; $('#mPenPick').textContent=S.penHoldPick?'вкл':'выкл';
  setColor(S.color); sizeStage();
  // crash guard: if the previous start died while restoring, start clean and offer the document instead of crashing again
  let crashed=false; try{ crashed=!!localStorage.getItem('proyavka.booting'); localStorage.setItem('proyavka.booting','1'); }catch(_){}
  let ok=false, found=0;
  try{ found = await migrateStorage() || 0; }catch(e){ console.warn('migrate', e); }
  pvLog(crashed?'безопасный запуск':'открываю документ'); if (!crashed) ok = await restore(); pvLog(ok?'документ открыт':'новый холст');
  if (found) setTimeout(()=>toast('В памяти нашлись прежние картинки: «Файл → Мои документы», карточки «Найдено»',6000), 1500);
  if (!ok) createDoc(3000,4000,'Без названия');
  // the guard stays on until the restored document has been drawn and lived a few seconds: a crash on the first frames also counts
  setTimeout(()=>{ try{ localStorage.removeItem('proyavka.booting'); }catch(_){} pvLog('запуск прошёл'); }, 6000);
  if (crashed) setTimeout(()=>dialog('<h3>Прошлый запуск не удался</h3><p>Похоже, Проявка закрылась, пока восстанавливала документ. Я открыла чистый холст, а сохранённый документ не тронут.</p>',
    [['Не восстанавливать', null], ['Восстановить документ', ()=>{ (async()=>{ try{ localStorage.setItem('proyavka.booting','1'); }catch(_){} const r=await restore(getCurDoc()); try{ localStorage.removeItem('proyavka.booting'); }catch(_){} if(!r) toast('Сохранённого документа нет'); })(); }, true]]), 600);
  setTool('brush'); syncSliders();
  if (crashedBefore) setTimeout(()=>toast('Safari перезапустил Проявку (похоже, не хватило памяти). Документ восстановлен с последнего автосохранения',6000), 900);
  if (stage.clientWidth >= 900){ showLayers(true); fitView(); }
  window.addEventListener('resize', ()=>{ sizeStage(); fitOpts(); });
  let seen=false; try{ seen=localStorage.getItem('kadr.help')==='1'; }catch(e){}
  const sp=$('#splash'); setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),400); }, 450);
  if (!seen) showHelp();
})();
</script>
