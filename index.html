<style>
/* Layout: graphite workroom — tools left (left hand), canvas centre, layers slide in from the right.
   Single dark theme on purpose: neutral grey so the UI does not bias colour judgement. */
:root{
  color-scheme: dark;
  --bg:#17181b;        /* around the document */
  --panel:#212328;     /* bars and panels */
  --panel-2:#2a2d33;   /* raised controls */
  --line:#363a42;
  --fg:#e6e7ea;
  --muted:#959ba5;
  --accent:#e2a65a;    /* tungsten key light, used only for "active" */
  --accent-ink:#1d1406;
  --danger:#e07a6a;
  --sans:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto 1fr}

/* top bar */
#top{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:48px;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.tb{height:36px;min-width:36px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg)}
.tb:active{background:var(--panel-2)}
.tb.on{background:var(--accent);color:var(--accent-ink)}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:24px;background:var(--line);flex:none;margin:0 4px}
.brand{font-weight:600;letter-spacing:.02em;padding:0 6px 0 2px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
#splash{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease}
#splash svg{width:120px;height:120px}
#splash b{font-size:22px;font-weight:600;letter-spacing:.04em}
#splash span{font-family:var(--mono);font-size:12px;color:var(--muted)}
#splash.out{opacity:0;pointer-events:none}
#opts{display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts > *{flex:none}
@media (max-width:1000px){.brand{font-size:0;gap:0}.brand svg{width:28px;height:28px}}
.opt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.hs{position:relative;height:30px;width:110px;flex:none;touch-action:none;cursor:pointer}
.hs::before{content:"";position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--line)}
.hs .hf{position:absolute;left:0;top:13px;height:4px;border-radius:2px;background:var(--accent)}
.hs .hk{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.row .hs{flex:1;width:auto}
.opt .v{font-family:var(--mono);color:var(--fg);min-width:30px;font-size:12px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--panel-2);border-radius:8px;padding:2px}
.seg button{height:30px;padding:0 10px;border-radius:6px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chk{height:30px;padding:0 10px;border-radius:6px;background:var(--panel-2);font-size:13px}
.chk.on{background:color-mix(in srgb,var(--accent) 22%,var(--panel-2));color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
#swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--fg);flex:none;box-shadow:0 0 0 2px var(--panel)}

/* left tool rail */
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;width:58px;overflow-y:auto;scrollbar-width:none}
#rail .tb{width:44px;height:44px;padding:0}
#rail .tb svg{width:22px;height:22px}
.vs{position:relative;width:26px;height:150px;border-radius:13px;background:var(--panel-2);margin-top:8px;flex:none;touch-action:none}
.vs .fill{position:absolute;left:0;right:0;bottom:0;border-radius:13px;background:color-mix(in srgb,var(--fg) 30%,transparent)}
.vs .knob{position:absolute;left:-3px;right:-3px;height:8px;border-radius:4px;background:var(--fg);transform:translateY(50%)}
.vlabel{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}

/* stage */
#stage{position:relative;overflow:hidden;touch-action:none;background:var(--bg);grid-row:2;grid-column:2;min-width:0;min-height:0}
#stage > canvas,#rail{touch-action:none}
#stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
#status span{background:color-mix(in srgb,var(--panel) 88%,transparent);padding:3px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
#zoomBadge{pointer-events:auto;cursor:pointer}
.hideui #top,.hideui #rail,.hideui #layers,.hideui #selbar,.hideui #xfbar{display:none!important}
.hideui #app{grid-template-rows:0 1fr;grid-template-columns:0 1fr}
.hideui #status{display:none}

/* floating action bars */
.fbar{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.45);width:max-content;max-width:calc(100% - 32px)}
#stage.lyopen .fbar{left:calc((100% - 306px)/2);max-width:calc(100% - 306px - 32px)}
.fbar .seg{margin-right:4px}
.fbar .seg button{height:32px}
.fbar button{height:36px;padding:0 12px;border-radius:8px;white-space:nowrap;font-size:13px}
.fbar button:active{background:var(--panel-2)}
.fbar .pri{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* layers */
#layers{position:absolute;top:8px;right:8px;bottom:8px;width:290px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 10px 36px rgba(0,0,0,.5);z-index:5}
#layers header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
#layers h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#lyList{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:4px;touch-action:pan-y}
.ly{display:grid;grid-template-columns:30px 46px 46px minmax(0,1fr);align-items:center;gap:8px;padding:6px;border-radius:10px;background:var(--panel-2)}
.ly.act{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ly.lift{opacity:.85;transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1.5px var(--accent);position:relative;z-index:2;transition:transform .12s}
.ly.dropb{box-shadow:inset 0 -3px 0 var(--accent)} .ly.dropa{box-shadow:inset 0 3px 0 var(--accent)}
.ly .eye{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ly .eye.off{opacity:.35}
.ly .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.th{width:46px;height:46px;border-radius:6px;background:repeating-conic-gradient(#3b3e44 0 25%,#2e3136 0 50%) 0 0/10px 10px;display:block;object-fit:contain;outline-offset:1px}
.th.sel{outline:2px solid var(--accent)}
.ly .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.ly .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
#lyProps{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.row label{font-size:12px;color:var(--muted);width:78px;flex:none}
.row input[type=text],.row select{flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px}
#lyName[readonly]{cursor:pointer}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.btns button{height:34px;border-radius:8px;background:var(--panel-2);font-size:12px}
.btns button:active{background:var(--line)}
.btns .dg{color:var(--danger)}

/* popovers / dialogs */
.pop{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.55);padding:8px}
#menu{top:54px;left:8px;width:250px;display:flex;flex-direction:column}
#menu button{text-align:left;height:40px;padding:0 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
#menu button:active{background:var(--panel-2)}
#menu small{color:var(--muted);font-family:var(--mono);font-size:11px}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
#picker{top:54px;right:8px;width:260px;padding:12px;display:flex;flex-direction:column;gap:10px}
#sv{width:100%;aspect-ratio:1;border-radius:8px;touch-action:none;display:block}
#hue{width:100%;height:22px;border-radius:11px;touch-action:none;display:block}
#recent{display:flex;flex-wrap:wrap;gap:6px}
#recent button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.scrim{position:absolute;inset:0;z-index:30;background:rgba(8,9,11,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 4px;font-size:18px;font-weight:600;text-wrap:balance}
.dlg p{margin:0 0 14px;color:var(--muted)}
.gest{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:14px 0}
.gest dt{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap;padding-top:2px}
.gest dd{margin:0}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dlg .actions button{height:40px;padding:0 16px;border-radius:10px;background:var(--panel-2)}
.dlg .actions .pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:12px}
.presets button{padding:10px;border-radius:10px;background:var(--panel-2);text-align:left}
.presets button.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.presets b{display:block;font-weight:500}
.presets span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dims{display:flex;gap:8px;align-items:center}
.dims input{width:100px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font-family:var(--mono)}
#toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:40;background:var(--panel-2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.45);font-size:13px;max-width:calc(100% - 32px);text-align:center}
#busy{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,9,11,.5);font-family:var(--mono);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// PatchMatch image completion (Wexler-style EM over an image pyramid). Runs inside a Worker.
function inpaint(W, H, rgba, holeMask, opts){
  const R = opts.r || 3, P = 2*R+1;
  const progress = opts.progress || (()=>{});
  // ---- pyramid
  const levels=[]; { let w=W,h=H, img=new Float32Array(W*H*3), m=new Uint8Array(holeMask);
    for (let i=0;i<W*H;i++){ img[i*3]=rgba[i*4]; img[i*3+1]=rgba[i*4+1]; img[i*3+2]=rgba[i*4+2]; }
    levels.push({w,h,img,m});
    while (Math.max(w,h)>opts.minSize){ const nw=Math.max(1,w>>1), nh=Math.max(1,h>>1), ni=new Float32Array(nw*nh*3), nm=new Uint8Array(nw*nh);
      for (let y=0;y<nh;y++) for (let x=0;x<nw;x++){ let s0=0,s1=0,s2=0,c=0,hole=0;
        for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++){ const xx=Math.min(w-1,2*x+dx), yy=Math.min(h-1,2*y+dy), k=yy*w+xx; if (m[k]) hole=1; else { s0+=img[k*3]; s1+=img[k*3+1]; s2+=img[k*3+2]; c++; } }
        const j=y*nw+x; nm[j]=hole; if(c){ ni[j*3]=s0/c; ni[j*3+1]=s1/c; ni[j*3+2]=s2/c; } }
      w=nw; h=nh; img=ni; m=nm; levels.push({w,h,img,m}); } }
  const L=levels.length;
  // ---- coarsest: onion-peel fill
  { const {w,h,img,m}=levels[L-1]; const known=new Uint8Array(w*h); for(let i=0;i<w*h;i++) known[i]=m[i]?0:1;
    let left=0; for(let i=0;i<w*h;i++) if(!known[i]) left++;
    while(left>0){ const add=[]; for (let y=0;y<h;y++) for(let x=0;x<w;x++){ const k=y*w+x; if(known[k]) continue; let s0=0,s1=0,s2=0,c=0;
        for (let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx<0||yy<0||xx>=w||yy>=h) continue; const q=yy*w+xx; if(known[q]){ s0+=img[q*3]; s1+=img[q*3+1]; s2+=img[q*3+2]; c++; } }
        if(c) add.push(k,s0/c,s1/c,s2/c); }
      if(!add.length) break; for(let i=0;i<add.length;i+=4){ const k=add[i]; img[k*3]=add[i+1]; img[k*3+1]=add[i+2]; img[k*3+2]=add[i+3]; known[k]=1; left--; } } }
  let nnx=null, nny=null, prevW=0;
  let rnd=12345; const rand=()=>{ rnd^=rnd<<13; rnd^=rnd>>>17; rnd^=rnd<<5; return (rnd>>>0)/4294967296; };
  for (let li=L-1; li>=0; li--){

    // valid source centres: patch fully inside and touching no hole pixel (summed-area table of the mask)
    const sat=new Int32Array((w+1)*(h+1)); for(let y=0;y<h;y++){ let row=0; for(let x=0;x<w;x++){ row+=m[y*w+x]; sat[(y+1)*(w+1)+x+1]=sat[y*(w+1)+x+1]+row; } }
    const holeIn=(x0,y0,x1,y1)=>sat[y1*(w+1)+x1]-sat[y0*(w+1)+x1]-sat[y1*(w+1)+x0]+sat[y0*(w+1)+x0];
    const valid=new Uint8Array(w*h); const vlist=[];
    for (let y=R;y<h-R;y++) for(let x=R;x<w-R;x++){ if(!holeIn(x-R,y-R,x+R+1,y+R+1)){ valid[y*w+x]=1; vlist.push(y*w+x); } }
    if (!vlist.length) continue;
    // targets: centres whose patch touches the hole
    const tgt=[]; for (let y=0;y<h;y++) for(let x=0;x<w;x++){ const x0=Math.max(0,x-R), y0=Math.max(0,y-R), x1=Math.min(w,x+R+1), y1=Math.min(h,y+R+1); if(holeIn(x0,y0,x1,y1)) tgt.push(y*w+x); }
    const NX=new Int32Array(w*h).fill(-1), NY=new Int32Array(w*h).fill(-1), ND=new Float32Array(w*h).fill(Infinity);
    const dist=(cx,cy,sx,sy,best)=>{ let d=0; for(let dy=-R;dy<=R;dy++){ const ty=cy+dy; if(ty<0||ty>=h) continue; const sy2=sy+dy;
        for(let dx=-R;dx<=R;dx++){ const tx=cx+dx; if(tx<0||tx>=w) continue; const a=(ty*w+tx)*3, b=(sy2*w+sx+dx)*3;
          const e0=img[a]-img[b], e1=img[a+1]-img[b+1], e2=img[a+2]-img[b+2]; d+=e0*e0+e1*e1+e2*e2; } if(d>=best) return d; } return d; };
    const tryS=(k,cx,cy,sx,sy)=>{ if(sx<R||sy<R||sx>=w-R||sy>=h-R) return; const s=sy*w+sx; if(!valid[s]) return; if(Math.abs(sx-cx)<=R && Math.abs(sy-cy)<=R && m[k]) return;
      const d=dist(cx,cy,sx,sy,ND[k]); if(d<ND[k]){ ND[k]=d; NX[k]=sx; NY[k]=sy; } };
    // init NNF: from coarser level if any, else random
    for (const k of tgt){ const x=k%w, y=(k/w)|0;
      if (nnx && prevW){ const pk=(y>>1)*prevW+(x>>1); const px=nnx[pk], py=nny[pk]; if(px>=0) tryS(k,x,y,px*2+(x&1),py*2+(y&1)); }
      if (NX[k]<0){ for(let t=0;t<4;t++){ const s=vlist[(rand()*vlist.length)|0]; tryS(k,x,y,s%w,(s/w)|0); } } }
    const em = li===L-1 ? opts.itCoarse : (li===0 ? opts.itFine : opts.itMid);
    const acc=new Float32Array(w*h*4);
    for (let it=0; it<em; it++){
      // PatchMatch passes
      for (let pass=0; pass<2; pass++){ const fwd=(pass+it)%2===0, dd=fwd?1:-1;
        for (let ii=0; ii<tgt.length; ii++){ const k=tgt[fwd?ii:tgt.length-1-ii], x=k%w, y=(k/w)|0;
          const lx=x-dd, ly=y-dd;
          if (lx>=0&&lx<w){ const q=y*w+lx; if(NX[q]>=0) tryS(k,x,y,NX[q]+dd,NY[q]); }
          if (ly>=0&&ly<h){ const q=ly*w+x; if(NX[q]>=0) tryS(k,x,y,NX[q],NY[q]+dd); }
          let rad=Math.max(w,h); const bx=NX[k], by=NY[k];
          while(rad>=1 && bx>=0){ tryS(k,x,y,(bx+(rand()*2-1)*rad)|0,(by+(rand()*2-1)*rad)|0); rad>>=1; }
          if (NX[k]<0){ const s=vlist[(rand()*vlist.length)|0]; tryS(k,x,y,s%w,(s/w)|0); } } }
      // voting: hole pixels become the weighted mean of the patches covering them
      acc.fill(0); let sigma=0, n=0; for(const k of tgt){ if(ND[k]<Infinity){ sigma+=ND[k]; n++; } } sigma=Math.max(1,(sigma/Math.max(1,n))*(opts.sig||0.75));
      for (const k of tgt){ if(NX[k]<0) continue; const x=k%w, y=(k/w)|0, wt=Math.exp(-ND[k]/(2*sigma))+1e-6;
        for(let dy=-R;dy<=R;dy++){ const ty=y+dy; if(ty<0||ty>=h) continue; for(let dx=-R;dx<=R;dx++){ const tx=x+dx; if(tx<0||tx>=w) continue; const t=ty*w+tx; if(!m[t]) continue;
          const s=((NY[k]+dy)*w+NX[k]+dx)*3; acc[t*4]+=img[s]*wt; acc[t*4+1]+=img[s+1]*wt; acc[t*4+2]+=img[s+2]*wt; acc[t*4+3]+=wt; } } }
      for (let t=0;t<w*h;t++){ if(m[t] && acc[t*4+3]>0){ img[t*3]=acc[t*4]/acc[t*4+3]; img[t*3+1]=acc[t*4+1]/acc[t*4+3]; img[t*3+2]=acc[t*4+2]/acc[t*4+3]; } }
      for (const k of tgt) ND[k]=Infinity; for (const k of tgt){ const x=k%w,y=(k/w)|0; if(NX[k]>=0){ const sx=NX[k],sy=NY[k]; NX[k]=-1; tryS(k,x,y,sx,sy); } }
    }
    // upsample the filled hole into the next finer level as its starting guess
    if (li>0){ const f=levels[li-1]; for(let y=0;y<f.h;y++) for(let x=0;x<f.w;x++){ const k=y*f.w+x; if(!f.m[k]) continue; const c=Math.min(h-1,y>>1)*w+Math.min(w-1,x>>1); f.img[k*3]=img[c*3]; f.img[k*3+1]=img[c*3+1]; f.img[k*3+2]=img[c*3+2]; } }
    nnx=NX; nny=NY; prevW=w;
    progress((L-li)/L);
  }
  const out=new Uint8ClampedArray(W*H*4), img=levels[0].img;
  for (let i=0;i<W*H;i++){ out[i*4]=img[i*3]; out[i*4+1]=img[i*3+1]; out[i*4+2]=img[i*3+2]; out[i*4+3]=255; }
  return out;
}
if (typeof self!=='undefined' && typeof window==='undefined'){
  self.onmessage=e=>{ const {W,H,rgba,mask,opts}=e.data; const out=inpaint(W,H,rgba,mask,{...opts, progress:p=>self.postMessage({progress:p})}); self.postMessage({done:true,out},[out.buffer]); };
}
if (typeof module!=='undefined') module.exports={inpaint};

</script>
<script>
"use strict";
/* ============ basics ============ */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const mk = (w,h) => { const c = document.createElement('canvas'); c.width = Math.max(1,w|0); c.height = Math.max(1,h|0); return c; };

let toastT;

let quietBusy=false;
function busy(on, msg='Работаю…'){ if (quietBusy && on) return; let b=$('#busy'); if(on){ if(!b){b=document.createElement('div');b.id='busy';$('#app').appendChild(b);} b.textContent=msg; b.hidden=false; } else if(b) b.hidden=true; }
const nextFrame = () => new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

const BLENDS = [
  ['source-over','Обычный','normal'],['multiply','Умножение','multiply'],['screen','Экран','screen'],
  ['overlay','Перекрытие','overlay'],['soft-light','Мягкий свет','soft light'],['hard-light','Жёсткий свет','hard light'],
  ['color-dodge','Осветление основы','color dodge'],['lighter','Линейный осветлитель','linear dodge'],['color-burn','Затемнение основы','color burn'],
  ['darken','Затемнение','darken'],['lighten','Замена светлым','lighten'],['difference','Разница','difference'],['exclusion','Исключение','exclusion'],
  ['hue','Цветовой тон','hue'],['saturation','Насыщенность','saturation'],['color','Цветность','color'],['luminosity','Яркость','luminosity']];
const blendToPsd = b => (BLENDS.find(x=>x[0]===b)||BLENDS[0])[2];
const psdToBlend = p => (BLENDS.find(x=>x[2]===p)||BLENDS[0])[0];

/* ============ state ============ */
const S = {
  tool:'brush', color:'#2b2f3a', size:40, opacity:1, hardness:0.6, flow:0.3, smooth:0.35,
  pSize:true, pOpac:true, eraserSize:80, selMode:'new', fingerDraw:false, xfFree:false
};
let doc = null;          // {w,h,name,layers:[], active, editMask}
let view = {x:0,y:0,s:1,r:0};
let dpr = Math.min(window.devicePixelRatio||1, 2);
let sel = null;          // {mask canvas, polys:[[x,y]...], bbox:{x,y,w,h}, inverted}
let stroke = null;       // active stroke
let xf = null;           // active transform
let lassoPts = null, rectSel = null;
let hover = null;        // pen hover position in screen px
let stageRect = null;    // cached; reading layout on every pointer event forces reflow
let uid = 1;

/* ============ canvases ============ */
const vc = $('#view'), oc = $('#ovl'), vx = ctx2(vc), ox = ctx2(oc);
let comp, tLayer, tStroke, tMask, strokeBuf = null;
function sizeStage(){ stageRect=null;
  const st = $('#stage'); dpr = Math.min(window.devicePixelRatio||1, 2);
  const W = Math.round(st.clientWidth*dpr), H = Math.round(st.clientHeight*dpr);
  for (const c of [vc, oc]) { c.width = W; c.height = H; }
  comp = mk(W,H); tLayer = mk(W,H); tStroke = mk(W,H); tMask = mk(W,H);
  requestRender();
}

/* ============ document & layers ============ */
function newLayer(name, fillWhite){
  const c = mk(doc.w, doc.h); const x = ctx2(c);
  if(!x) throw new Error('mem');
  if (fillWhite){ x.fillStyle='#fff'; x.fillRect(0,0,doc.w,doc.h); }
  return { id: uid++, name, canvas:c, ctx:x, visible:true, opacity:1, blend:'source-over', mask:null, dirty:true };
}
function newMask(L, fromSel){
  const c = mk(doc.w, doc.h), x = ctx2(c);
  if (fromSel && sel){ x.drawImage(sel.mask,0,0); }
  else { x.fillStyle='#fff'; x.fillRect(0,0,doc.w,doc.h); }
  return { canvas:c, ctx:x, enabled:true };
}
function createDoc(w,h,name='Без названия'){
  clearHistory(); sel=null; xf=null; stroke=null; strokeBuf=null;
  doc = { w, h, name, layers:[], active:0, editMask:false };
  doc.layers.push(Object.assign(newLayer('Фон', true)));
  doc.layers.push(newLayer('Слой 1'));
  doc.active = 1;
  fitView(); layersChanged(); updateSelBar(); markDirty();
}
const AL = () => doc.layers[doc.active];
function memMB(){
  let n = 0; for (const L of doc.layers){ n++; if (L.mask) n++; }
  if (strokeBuf) n++; if (sel) n++;
  return Math.round(n*doc.w*doc.h*4/1048576 + histBytes/1048576);
}

/* ============ view ============ */
function fitView(){
  if (!doc || $('#stage').clientWidth<10 || $('#stage').clientHeight<10) return;
  const st=$('#stage'), H=st.clientHeight, W=st.clientWidth - ($('#layers').hidden ? 0 : Math.min(306, st.clientWidth*0.5));
  const s = Math.min(W/doc.w, H/doc.h)*0.92;
  view = { s, r:0, x:(W-doc.w*s)/2, y:(H-doc.h*s)/2 };
  requestRender();
}
function viewM(){ // doc -> CSS px
  const c=Math.cos(view.r)*view.s, s=Math.sin(view.r)*view.s;
  return [c,s,-s,c,view.x,view.y];
}
function setVT(ctx, extra){ const m=viewM(); ctx.setTransform(m[0]*dpr,m[1]*dpr,m[2]*dpr,m[3]*dpr,m[4]*dpr,m[5]*dpr); if(extra) ctx.transform(...extra); }
function toDoc(px,py){ const dx=px-view.x, dy=py-view.y, c=Math.cos(-view.r), s=Math.sin(-view.r); return [(dx*c-dy*s)/view.s, (dx*s+dy*c)/view.s]; }
function toScr(x,y,extra){ if(extra){ const [a,b,c,d,e,f]=extra; const nx=a*x+c*y+e, ny=b*x+d*y+f; x=nx; y=ny; } const m=viewM(); return [m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]]; }

/* ============ rendering ============ */
let needRender=false;
function requestRender(){ if(!needRender){ needRender=true; requestAnimationFrame(render); } }
let checker=null;
function getChecker(){
  if(checker) return checker;
  const c=mk(16,16), x=ctx2(c); x.fillStyle='#d9d9d9'; x.fillRect(0,0,16,16); x.fillStyle='#f2f2f2'; x.fillRect(0,0,8,8); x.fillRect(8,8,8,8);

}
/* navigation cache: a flattened copy of the document, rebuilt only after edits */
let navigating=false, navT=null, contentVer=1, preview=null, previewVer=0;
function navStart(){ navigating=true; clearTimeout(navT); }
let pvT=null;
function bumpContent(){ contentVer++; clearTimeout(pvT); pvT=setTimeout(()=>{ if(doc && !navigating && !stroke && !xf && toolPtr===null) getPreview(); }, 500); }
function navEnd(delay=90){ clearTimeout(navT); navT=setTimeout(()=>{ navigating=false; requestRender(); }, delay); }
function getPreview(){
  if (preview && previewVer===contentVer) return preview;
  const k=Math.min(1, 2560/Math.max(doc.w,doc.h)), w=Math.round(doc.w*k), h=Math.round(doc.h*k);
  if (!preview || preview.width!==w || preview.height!==h) preview=mk(w,h);
  const x=ctx2(preview); x.setTransform(1,0,0,1,0,0); x.globalAlpha=1; x.globalCompositeOperation='source-over';
  x.clearRect(0,0,w,h); x.imageSmoothingQuality='medium';
  let tmp=null;
  for (const L of doc.layers){ if(!L.visible) continue; let src=L.canvas;
    if (L.mask&&L.mask.enabled){ tmp=tmp||mk(w,h); const t=ctx2(tmp); t.globalCompositeOperation='source-over'; t.clearRect(0,0,w,h); t.drawImage(L.canvas,0,0,w,h); t.globalCompositeOperation='destination-in'; t.drawImage(L.mask.canvas,0,0,w,h); src=tmp; }

}
function render(){
  needRender=false; if(!doc) return;

  vx.setTransform(1,0,0,1,0,0); vx.globalAlpha=1; vx.globalCompositeOperation='source-over';
  vx.fillStyle=BG; vx.fillRect(0,0,W,H);

  setVT(vx);
  const pat=getChecker(); try{ pat.setTransform(new DOMMatrix().scale(1/view.s)); }catch(e){}
  vx.fillStyle=pat; vx.fillRect(0,0,doc.w,doc.h);

  if (navigating && !stroke && !xf){
    const pc=getPreview();
    if (pc){ vx.imageSmoothingEnabled = view.s*doc.w/pc.width < 2.5; vx.imageSmoothingQuality='low';
      setVT(vx); vx.drawImage(pc,0,0,doc.w,doc.h); renderOverlay(); updateStatus(); return; }
  }

  const cc=ctx2(comp); cc.setTransform(1,0,0,1,0,0); cc.clearRect(0,0,W,H);

  for (const c of [cc, ctx2(tLayer), ctx2(tMask), ctx2(tStroke)]){ c.imageSmoothingEnabled = smooth; c.imageSmoothingQuality = view.s<1 ? 'medium' : 'low'; }
  cc.save(); setVT(cc); cc.beginPath(); cc.rect(0,0,doc.w,doc.h); cc.clip();
  for (const L of doc.layers){ if(L.visible) drawLayer(cc,L); }
  cc.restore();
  vx.setTransform(1,0,0,1,0,0); vx.drawImage(comp,0,0);
  if (xf){ // part of the piece that hangs outside the canvas: shown faded
    vx.save(); setVT(vx); vx.beginPath(); vx.rect(-1e6,-1e6,2e6,2e6); vx.rect(0,0,doc.w,doc.h); vx.clip('evenodd');
    vx.globalAlpha=0.32; setVT(vx, xfMatrix()); vx.drawImage(xf.float,0,0); vx.restore();
  }
  renderOverlay();
  updateStatus();
}
function drawLayer(cc, L){
  const isStroke = stroke && stroke.layer===L, isXf = xf && xf.layer===L;
  const hasMask = L.mask && L.mask.enabled;
  if (!isStroke && !isXf && !hasMask){
    setVT(cc); cc.globalAlpha=L.opacity; cc.globalCompositeOperation=L.blend; cc.drawImage(L.canvas,0,0);
    cc.globalAlpha=1; cc.globalCompositeOperation='source-over'; return;
  }
  const t=ctx2(tLayer); t.setTransform(1,0,0,1,0,0); t.clearRect(0,0,tLayer.width,tLayer.height);
  t.imageSmoothingQuality = cc.imageSmoothingQuality;
  setVT(t);
  if (isXf && xf.target==='content'){

    e.preventDefault();
    const rows=[...document.querySelectorAll('#lyList .ly')]; rows.forEach(r=>r.classList.remove('dropa','dropb'));

let hsv=[0,0,0.2]; const recent=[];
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0; if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; } return [h, mx?d/mx:0, mx]; }

const loadImage = file => new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('img')); im.src=u; });
$('#fOpen').addEventListener('change', async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  busy(true,'Открываю '+f.name+'…'); await nextFrame();
  try{
    if (/\.psd$/i.test(f.name)) await openPsd(f);
    else { const im=await loadImage(f); createDoc(im.naturalWidth, im.naturalHeight, f.name.replace(/\.[^.]+$/,'')); doc.layers[0].ctx.clearRect(0,0,doc.w,doc.h); doc.layers[0].ctx.drawImage(im,0,0); doc.layers[0].name=f.name; }
    layersChanged(); requestRender(); toast('Открыт '+f.name);
  }catch(err){ console.error(err); toast('Не получилось открыть файл: '+(err.message==='mem'?'не хватает памяти':'формат не прочитался'),4000); }
  busy(false);

async function openPsd(f){
  if (!window.agPsd) throw new Error('Библиотека PSD не загрузилась');
  const buf=await f.arrayBuffer();
  const psd=agPsd.readPsd(buf,{skipThumbnail:true,skipCompositeImageData:false});
  createDoc(psd.width, psd.height, f.name.replace(/\.psd$/i,''));
  const layers=[]; let groups=false;
  (function walk(ch){ for(const c of ch||[]){ if(c.children){ groups=true; walk(c.children);} else layers.push(c);} })(psd.children);
  if (!layers.length && psd.canvas){ doc.layers[0].ctx.clearRect(0,0,doc.w,doc.h); doc.layers[0].ctx.drawImage(psd.canvas,0,0); doc.layers.length=1; doc.active=0; return; }
  doc.layers=[];
  for (const c of layers){
    const L=newLayer(c.name||'Слой');
    if (c.canvas) L.ctx.drawImage(c.canvas, c.left||0, c.top||0);
    L.visible=!c.hidden; L.opacity=c.opacity??1; L.blend=psdToBlend(c.blendMode||'normal');
    if (c.mask && c.mask.canvas){
      const m=newMask(L); const mx=m.ctx; const def=(c.mask.defaultColor??255);
      mx.clearRect(0,0,doc.w,doc.h); if(def>0){ mx.fillStyle=`rgba(255,255,255,${def/255})`; mx.fillRect(0,0,doc.w,doc.h); }
      const mc=c.mask.canvas, g=ctx2(mc).getImageData(0,0,mc.width,mc.height), d=g.data;
      for(let i=0;i<d.length;i+=4){ const v=d[i]; d[i]=d[i+1]=d[i+2]=255; d[i+3]=v; }
      const tmp=mk(mc.width,mc.height); ctx2(tmp).putImageData(g,0,0);
      mx.clearRect(c.mask.left||0,c.mask.top||0,mc.width,mc.height); mx.drawImage(tmp,c.mask.left||0,c.mask.top||0);
      m.enabled=!c.mask.disabled; L.mask=m;
    }
    doc.layers.push(L);
    await nextFrame();
  }
  doc.active=doc.layers.length-1; clearHistory();
  if (groups) toast('Группы из PSD развёрнуты в плоский список слоёв',3600);
}
$('#fPlace').addEventListener('change', e=>{ const f=e.target.files[0]; e.target.value=''; if(f) placeFile(f); });
async function placeFile(f){
  if (!doc) return;
  if (xf){ toast('Сначала примени или отмени трансформ'); return; }
  try{
    const im=await loadImage(f); const c=mk(im.naturalWidth,im.naturalHeight); ctx2(c).drawImage(im,0,0);
    const L=newLayer(f.name.replace(/\.[^.]+$/,'')); const idx=doc.active+1, prevA=doc.active;
    doc.layers.splice(idx,0,L); doc.active=idx; doc.editMask=false; layersChanged();
    const scale=Math.min(1, doc.w*0.8/c.width, doc.h*0.8/c.height);
    const prev=S.tool==='transform'?'brush':S.tool;
    beginTransform({ float:c, x:(doc.w-c.width)/2, y:(doc.h-c.height)/2, scale, prevTool:prev,
      onCancel:()=>{ doc.layers.splice(doc.layers.indexOf(L),1); doc.active=prevA; layersChanged(); } });
    if (xf) xf.placedEntry={ undo(){ doc.layers.splice(doc.layers.indexOf(L),1); doc.active=prevA; }, redo(){ doc.layers.splice(idx,0,L); doc.active=idx; }, bytes:doc.w*doc.h*4 };
  }catch(err){ toast('Картинка не открылась'); }
}

function flatten(scale=1, white){
  const w=Math.round(doc.w*scale), h=Math.round(doc.h*scale), c=mk(w,h), x=ctx2(c);
  x.imageSmoothingQuality='high'; if (white){ x.fillStyle='#fff'; x.fillRect(0,0,w,h); }
  for (const L of doc.layers){ if(!L.visible) continue; let src=L.canvas;
    if (L.mask&&L.mask.enabled){ src=mk(doc.w,doc.h); const s=ctx2(src); s.drawImage(L.canvas,0,0); s.globalCompositeOperation='destination-in'; s.drawImage(L.mask.canvas,0,0); }
    x.globalAlpha=L.opacity; x.globalCompositeOperation=L.blend; x.drawImage(src,0,0,w,h); }
  x.globalAlpha=1; x.globalCompositeOperation='source-over'; return c;
}
const toBlob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
let dl=null; const dlReady=(async()=>{ try{ dl=await window.claude?.use?.('downloads'); }catch(e){ dl=null; } })();
async function saveFile(name, data){
  await dlReady;
  if (!dl){
    const blob = data instanceof Blob ? data : new Blob([data]);
    const file = new File([blob], name, {type: blob.type || 'application/octet-stream'});
    try{ if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); toast('Готово: '+name); return; } }
    catch(e){ if (e && e.name==='AbortError'){ toast('Сохранение отменено'); return; } }
    const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
    toast('Сохранено: '+name); return;
  }
  try{ await dl.save({filename:name, data}); toast('Сохранено: '+name); }
  catch(e){ if(e&&e.code==='declined') toast('Сохранение отменено'); else toast('Не сохранилось: '+(e&&e.message||'ошибка'),4000); }
}
async function exportImg(kind){
  busy(true,'Собираю файл…'); await nextFrame();
  try{
    if (kind==='psd'){
      if(!window.agPsd||!window.fflate) throw new Error('Библиотеки PSD не загрузились');
      const children=doc.layers.map(L=>{ const o={name:L.name, canvas:L.canvas, left:0, top:0, opacity:L.opacity, hidden:!L.visible, blendMode:blendToPsd(L.blend)};
        if (L.mask){ const m=mk(doc.w,doc.h), mx=ctx2(m); mx.fillStyle='#000'; mx.fillRect(0,0,doc.w,doc.h); mx.drawImage(L.mask.canvas,0,0); o.mask={canvas:m,left:0,top:0,defaultColor:0,disabled:!L.mask.enabled}; }
        return o; });
      const buf=agPsd.writePsd({width:doc.w,height:doc.h,children,canvas:flatten(1)},{generateThumbnail:false});
      busy(false);
      if (!dl){ await saveFile(safeName()+'.psd', new Blob([buf],{type:'image/vnd.adobe.photoshop'})); return; }
      const zip=fflate.zipSync({[safeName()+'.psd']:new Uint8Array(buf)},{level:0});
      await saveFile(safeName()+'.psd.zip', new Blob([zip]));
      return;
    }
    const c=flatten(kind==='png50'?0.5:1, kind==='jpg');
    const blob=await toBlob(c, kind==='jpg'?'image/jpeg':'image/png', 0.95);
    busy(false); await saveFile(safeName()+(kind==='png50'?'_preview':'')+(kind==='jpg'?'.jpg':'.png'), blob);
  }catch(err){ console.error(err); busy(false); toast('Экспорт не удался: '+(err.message||'ошибка'),4000); }
}

function flipFix(){ // keep scales positive by flipping pixels instead
  const f=xf.float, c=mk(f.width,f.height), x=ctx2(c);
  if (xf.sx<0){ x.translate(f.width,0); x.scale(-1,1); xf.sx*=-1; } else { x.translate(0,f.height); x.scale(1,-1); xf.sy*=-1; }
  x.drawImage(f,0,0); xf.float=c; requestRender();
}

/* ============ input ============ */
const stage=$('#stage');
const touches=new Map(); let gesture=null, onePan=null, holdT=null, toolPtr=null, lastPenT=0, fingerTool=false;
function capture(e){ try{ stage.setPointerCapture(e.pointerId); }catch(_){} }
function stagePos(e){ const r=stageRect||(stageRect=stage.getBoundingClientRect()); return [e.clientX-r.left, e.clientY-r.top]; }
window.addEventListener('scroll', ()=>{ stageRect=null; }, true);
function penPressure(e){ if(e.pointerType==='mouse') return e.buttons?1:0; return e.pressure||0.5; }

stage.addEventListener('pointerdown', e=>{
  if (e.target!==oc && e.target!==vc) return;
  e.preventDefault();
  closePops();
  if (e.pointerType==='touch'){
    if (toolPtr!==null && !fingerTool) return; // palm while the pen works
    const p=stagePos(e); touches.set(e.pointerId,{x:p[0],y:p[1],x0:p[0],y0:p[1]}); capture(e);
    clearTimeout(holdT);
    if (touches.size===1){
      if (S.fingerDraw || (S.tool==='transform' && xf) || S.tool==='tap'){ fingerTool=true; toolDown(e,p); }
      else { onePan={x:p[0],y:p[1],vx:view.x,vy:view.y,moved:false};
        holdT=setTimeout(()=>{ if(onePan&&!onePan.moved){ onePan.pick=true; pickAt(p[0],p[1]); } },420); }
      gesture={t0:Date.now(), max:1, moved:false, start:null};
    } else {
      if (fingerTool){ toolCancel(); fingerTool=false; }
      onePan=null; if(!gesture) gesture={t0:Date.now(),max:touches.size,moved:false,start:null}; startPinch();
      gesture.max=Math.max(gesture.max,touches.size);
    }
    return;
  }
  // pen / mouse
  if ((spaceDown || e.button===1) && toolPtr===null){ panDrag={id:e.pointerId,x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; capture(e); updateCursor(); return; }
  lastPenT=Date.now();
  if (toolPtr!==null) return;
  capture(e);
  toolDown(e, stagePos(e));
});
stage.addEventListener('pointermove', e=>{
  if (e.pointerType==='touch'){
    const t=touches.get(e.pointerId); if(!t) return;
    const p=stagePos(e); t.x=p[0]; t.y=p[1];
    if (Math.hypot(t.x-t.x0,t.y-t.y0)>10 && gesture) gesture.moved=true;
    if (fingerTool && e.pointerId===toolPtr){ toolMove(e); return; }
    if (touches.size>=2 && gesture && gesture.start) doPinch();
    else if (onePan){
      if (onePan.pick){ pickAt(p[0],p[1]); return; }
      const dx=p[0]-onePan.x, dy=p[1]-onePan.y;
      if (Math.hypot(dx,dy)>6){ onePan.moved=true; clearTimeout(holdT); }
      if (onePan.moved){ navStart(); view.x=onePan.vx+dx; view.y=onePan.vy+dy; requestRender(); }
    }
    return;
  }
  if (panDrag && e.pointerId===panDrag.id){ navStart(); view.x=panDrag.vx+e.clientX-panDrag.x; view.y=panDrag.vy+e.clientY-panDrag.y; requestRender(); return; }
  if (e.pointerId===toolPtr){ lastPenT=Date.now(); toolMove(e); return; }
  if (e.pointerType==='pen' || e.pointerType==='mouse'){ hover = (e.buttons===0) ? stagePos(e) : null; renderOverlay(); }
});
function endTouch(e){
  if (!touches.has(e.pointerId)) return;
  touches.delete(e.pointerId); clearTimeout(holdT);
  if (fingerTool && e.pointerId===toolPtr){ toolUp(e); fingerTool=false; }
  if (onePan && onePan.pick){ pushRecent(S.color); }
  if (touches.size===0){
    if (gesture && !gesture.moved && Date.now()-gesture.t0<350){
      if (gesture.max===2) undo(); else if (gesture.max===3) redo(); else if (gesture.max>=4) toggleUI();
      else if (gesture.max===1 && !S.fingerDraw && !xf && !onePan?.pick && (S.tool==='lasso'||S.tool==='rect') && sel && S.selMode==='new') deselect();
    }
    gesture=null; onePan=null; if (navigating) navEnd();
  } else if (touches.size>=2 && gesture) startPinch();
  else if (touches.size===1){ gesture && (gesture.start=null); const [t]=touches.values(); onePan={x:t.x,y:t.y,vx:view.x,vy:view.y,moved:true}; }
}
stage.addEventListener('pointerup', e=>{ if(e.pointerType==='touch'){ endTouch(e); return; } if(panDrag && e.pointerId===panDrag.id){ panDrag=null; navEnd(); updateCursor(); return; } if(e.pointerId===toolPtr) toolUp(e); });
stage.addEventListener('auxclick', e=>e.preventDefault());
stage.addEventListener('pointercancel', e=>{ if(e.pointerType==='touch'){ endTouch(e); return; } if(e.pointerId===toolPtr) toolCancel(); });
stage.addEventListener('pointerleave', e=>{ if(e.pointerType!=='touch' && toolPtr===null){ hover=null; renderOverlay(); } });

function startPinch(){
  const [a,b]=[...touches.values()];
  gesture.start={ c:[(a.x+b.x)/2,(a.y+b.y)/2], d:Math.hypot(b.x-a.x,b.y-a.y)||1, ang:Math.atan2(b.y-a.y,b.x-a.x), v:{...view} };
  gesture.start.doc = (()=>{ const sv=view; return toDoc(...gesture.start.c); })();
}
function doPinch(){ navStart();
  const [a,b]=[...touches.values()], g=gesture.start;
  const c=[(a.x+b.x)/2,(a.y+b.y)/2], d=Math.hypot(b.x-a.x,b.y-a.y)||1, ang=Math.atan2(b.y-a.y,b.x-a.x);
  if (Math.hypot(c[0]-g.c[0],c[1]-g.c[1])>8 || Math.abs(d-g.d)>8) gesture.moved=true;
  let s=clamp(g.v.s*d/g.d, 0.02, 32), r=g.v.r+(ang-g.ang);
  const snap=Math.round(r/(Math.PI/2))*(Math.PI/2); if(Math.abs(r-snap)<0.06) r=snap;
  if (Math.abs(r - g.v.r) > 0.02) gesture.moved=true;
  const cs=Math.cos(r)*s, sn=Math.sin(r)*s, [dx,dy]=g.doc;
  view={ s, r, x:c[0]-(cs*dx-sn*dy), y:c[1]-(sn*dx+cs*dy) };
  requestRender();
}
function toggleUI(){ const r0=stage.getBoundingClientRect(); document.body.classList.toggle('hideui'); setTimeout(()=>{ sizeStage(); const r1=stage.getBoundingClientRect(); view.x+=r0.left-r1.left; view.y+=r0.top-r1.top; requestRender(); },30); toast(document.body.classList.contains('hideui')?'Интерфейс скрыт — тап четырьмя пальцами вернёт':'Интерфейс на месте',1500); }

/* tool dispatch (pen, mouse, or finger when finger drawing is on) */
let activeTool='brush', tmpMode=null;
function toolDown(e,p){
  toolPtr=e.pointerId; hover=null;
  const t = activeTool = (altDown && S.tool!=='transform') ? 'picker' : S.tool;
  if (t==='brush'||t==='eraser'){ if(!strokeBegin(p)){ toolPtr=null; return; } strokeMove(p[0],p[1],penPressure(e)); }
  else if (t==='lasso'){ lassoPts=[toDoc(...p)]; }
  else if (t==='rect'){ const [x,y]=toDoc(...p); rectSel={x0:x,y0:y,x1:x,y1:y}; }
  if ((t==='lasso'||t==='rect') && e.shiftKey && sel){ tmpMode=S.selMode; S.selMode='add'; }
  else if (t==='transform'){ if(xf) xfDown(p[0],p[1]); }
  else if (t==='picker'){ pickAt(p[0],p[1]); }
  else if (t==='tap'){ tapDown=p; }
}
let tapDown=null;
function toolMove(e){
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const list = evs.length ? evs : [e];
  const t=activeTool;
  for (const ev of list){
    const p=stagePos(ev);
    if (t==='brush'||t==='eraser') strokeMove(p[0],p[1],penPressure(ev));
    else if (t==='lasso' && lassoPts){ const q=toDoc(...p), l=lassoPts[lassoPts.length-1]; if(Math.hypot(q[0]-l[0],q[1]-l[1])*view.s>2) lassoPts.push(q); }
    else if (t==='rect' && rectSel){ const [x,y]=toDoc(...p); rectSel.x1=x; rectSel.y1=y; }
    else if (t==='transform' && xf) xfMove(p[0],p[1]);
    else if (t==='picker') pickAt(p[0],p[1]);
  }
  if (t!=='brush'&&t!=='eraser') renderOverlay();
}
/* desktop: wheel zoom / rotate, space or middle-button pan, Alt eyedropper */
let spaceDown=false, altDown=false, panDrag=null;
function zoomAt(px,py,k){
  const [dx,dy]=toDoc(px,py); view.s=clamp(view.s*k,0.02,32);
  const c=Math.cos(view.r)*view.s, sn=Math.sin(view.r)*view.s;
  view.x=px-(c*dx-sn*dy); view.y=py-(sn*dx+c*dy); requestRender();
}
function rotateAt(px,py,a){
  const [dx,dy]=toDoc(px,py); let r=view.r+a; const snap=Math.round(r/(Math.PI/2))*(Math.PI/2); if(Math.abs(r-snap)<0.02) r=snap; view.r=r;
  const c=Math.cos(view.r)*view.s, sn=Math.sin(view.r)*view.s;
  view.x=px-(c*dx-sn*dy); view.y=py-(sn*dx+c*dy); requestRender();
}
stage.addEventListener('wheel', e=>{
  if (!e.target.closest('#stage > canvas')) return;
  e.preventDefault();
  navStart(); navEnd(200);
  const [px,py]=stagePos(e), k=e.deltaMode===1?16:(e.deltaMode===2?400:1);
  const dy=e.deltaY*k, dx=e.deltaX*k;
  if (e.altKey) rotateAt(px,py,(dy||dx)*0.004);
  else if (e.shiftKey){ view.x-=dy||dx; requestRender(); }
  else if (e.ctrlKey||e.metaKey) zoomAt(px,py,Math.exp(-dy*0.01));
  else if (Math.abs(dx)>0 && Math.abs(dy)<40 && e.deltaMode===0 && Math.abs(dx)>=Math.abs(dy)*0.5){ view.x-=dx; view.y-=dy; requestRender(); }
  else zoomAt(px,py,Math.exp(-dy*0.0018));
},{passive:false});
function updateCursor(){
  const st=stage.style;
  if (panDrag) st.cursor='grabbing';
  else if (spaceDown) st.cursor='grab';
  else if (altDown && S.tool!=='transform') st.cursor='crosshair';
  else st.cursor = (S.tool==='brush'||S.tool==='eraser') ? 'none' : (S.tool==='transform' ? 'move' : 'crosshair');
}
document.addEventListener('keyup', e=>{
  if (e.key===' '){ spaceDown=false; updateCursor(); }
  if (e.key==='Alt'){ altDown=false; updateCursor(); }
});
window.addEventListener('blur', ()=>{ spaceDown=altDown=false; panDrag=null; updateCursor(); });
function toolUp(e){
  const t=activeTool; toolPtr=null;
  if (t==='brush'||t==='eraser') strokeEnd(false);
  else if (t==='lasso' && lassoPts){ const pts=lassoPts; lassoPts=null; if(pts.length<3){ if(S.selMode==='new') deselect(); } else applySelPoly(pts); }
  else if (t==='rect' && rectSel){ const r=normRect(rectSel); rectSel=null; if(r.w*view.s<4||r.h*view.s<4){ if(S.selMode==='new') deselect(); } else applySelPoly([[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]]); }
  else if (t==='transform' && xf) xf.drag=null;
  else if (t==='picker') pushRecent(S.color);
  else if (t==='tap' && tapDown){ const q=stagePos(e); if (Math.hypot(q[0]-tapDown[0],q[1]-tapDown[1])<12){ const [dx,dy]=toDoc(...tapDown); tapSelect(dx,dy); } tapDown=null; }
  if (tmpMode){ S.selMode=tmpMode; tmpMode=null; }
  if (e.pointerType!=='touch') hover=stagePos(e);
  renderOverlay();
}
function toolCancel(){ toolPtr=null; if(stroke) strokeEnd(true); lassoPts=null; rectSel=null; if(xf) xf.drag=null; requestRender(); }

/* keyboard */
document.addEventListener('keydown', e=>{
  if (e.target.matches('input,select,textarea')) return;
  if (e.key===' '){ e.preventDefault(); if(!spaceDown){ spaceDown=true; updateCursor(); } return; }
  if (e.key==='Alt'){ e.preventDefault(); altDown=true; updateCursor(); return; }
  const k=e.key.toLowerCase(), mod=e.metaKey||e.ctrlKey;
  if (mod && k==='0'){ e.preventDefault(); fitView(); return; }
  if (mod && k==='1'){ e.preventDefault(); const st=stage.getBoundingClientRect(); zoomAt(st.width/2,st.height/2,1/view.s); return; }
  if (mod && (k==='='||k==='+')){ e.preventDefault(); const st=stage.getBoundingClientRect(); zoomAt(st.width/2,st.height/2,1.25); return; }
  if (mod && k==='-'){ e.preventDefault(); const st=stage.getBoundingClientRect(); zoomAt(st.width/2,st.height/2,0.8); return; }
  if (mod && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if (mod && k==='d'){ e.preventDefault(); deselect(); return; }
  if (mod && k==='i'){ e.preventDefault(); if (AL().mask && doc.editMask) invertMask(); else if (sel) invertSel(); else if (AL().mask) invertMask(); return; }
  if (mod && k==='j'){ e.preventDefault(); sel?selCopyToLayer():dupLayer(); return; }
  if (mod) return;
  const map={b:'brush',e:'eraser',l:'lasso',m:'rect',v:'transform',i:'picker',t:'tap'};
  if (map[k]){ setTool(map[k]); return; }
  if (k==='['||k===']'){ const f=k===']'?1.15:1/1.15; const s=clamp(Math.round(curSize()*f+(k===']'?1:-1)),1,SIZE_MAX); if(S.tool==='eraser') S.eraserSize=s; else S.size=s; spriteKey=''; syncSliders(); return; }
  if (k==='enter' && xf){ xfApply(); return; }
  if (k==='escape'){ if(xf) xfCancel(); else closePops(); return; }
  if ((k==='delete'||k==='backspace') && sel){ selDelete(); }
});
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('contextmenu', e=>e.preventDefault());

/* ============ prefs & autosave ============ */
function savePrefs(){ try{ localStorage.setItem('kadr.prefs', JSON.stringify({color:S.color,size:S.size,eraserSize:S.eraserSize,opacity:S.opacity,hardness:S.hardness,flow:S.flow,smooth:S.smooth,pSize:S.pSize,pOpac:S.pOpac,fingerDraw:S.fingerDraw,recent})); }catch(e){} }
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem('kadr.prefs')||'null'); if(p){ const {recent:r,...rest}=p; Object.assign(S,rest); if(r) recent.push(...r); } }catch(e){} }
const DB='kadr', STORE='doc';
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbPut(map){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction(STORE,'readwrite'), s=tx.objectStore(STORE); for(const [k,v] of Object.entries(map)) s.put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function idbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const r=d.transaction(STORE).objectStore(STORE).get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
let saveT=null, saving=false, dirtyDoc=false;
function markDirty(){ bumpContent(); dirtyDoc=true; clearTimeout(saveT); saveT=setTimeout(autosave, 6000); }
async function autosave(){
  if (!doc) return;
  if (saving || stroke || xf || toolPtr!==null){ saveT=setTimeout(autosave,3000); return; }
  saving=true; dirtyDoc=false;
  try{
    const put={};
    for (const L of doc.layers){ if (L.dirty || !L.saved){ put['c'+L.id]=await toBlob(L.canvas,'image/png'); if(L.mask) put['m'+L.id]=await toBlob(L.mask.canvas,'image/png'); L.dirty=false; L.saved=true; } }
    put.meta={ w:doc.w, h:doc.h, name:doc.name, active:doc.active, uid, layers:doc.layers.map(L=>({id:L.id,name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,mask:L.mask?{enabled:L.mask.enabled}:null})), t:Date.now() };
    await idbPut(put);
  }catch(e){ console.warn('autosave', e); }
  saving=false; if (dirtyDoc) markDirty();
}
async function restore(){
  try{
    const m=await idbGet('meta'); if(!m||!m.layers||!m.layers.length) return false;
    busy(true,'Восстанавливаю документ…'); await nextFrame();
    doc={w:m.w,h:m.h,name:m.name,layers:[],active:0,editMask:false};
    for (const l of m.layers){
      const L=newLayer(l.name); L.id=l.id; Object.assign(L,{visible:l.visible,opacity:l.opacity,blend:l.blend});
      const cb=await idbGet('c'+l.id); if(cb){ const im=await createImageBitmap(cb); L.ctx.drawImage(im,0,0); im.close&&im.close(); }
      await nextFrame();
      if (l.mask){ L.mask=newMask(L); L.mask.enabled=l.mask.enabled; const mb=await idbGet('m'+l.id); if(mb){ const im=await createImageBitmap(mb); L.mask.ctx.clearRect(0,0,doc.w,doc.h); L.mask.ctx.drawImage(im,0,0); im.close&&im.close(); } }
      L.dirty=false; L.saved=true; doc.layers.push(L);
    }
    uid=Math.max(uid, (m.uid||0)+1, ...doc.layers.map(L=>L.id+1));
    doc.active=clamp(m.active||0,0,doc.layers.length-1);
    busy(false); fitView(); layersChanged(); toast('Продолжаем «'+doc.name+'» с того же места');
    return true;
  }catch(e){ console.warn('restore',e); busy(false); doc=null; return false; }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden && dirtyDoc){ clearTimeout(saveT); autosave(); } });

const APP_VERSION='2026-10-01 · 20:10'; $('#appVer').textContent=APP_VERSION;
/* ============ storage diagnostics ============ */
let visit={ls:'—', idb:'—'};
(async()=>{
  try{ const n=(+localStorage.getItem('proyavka.visits')||0)+1; localStorage.setItem('proyavka.visits',n); visit.ls=n; }catch(e){ visit.ls='нет доступа'; }
  try{ const d=await mdb(); const cur=await new Promise(r=>{ const q=d.transaction('m').objectStore('m').get('__visits'); q.onsuccess=()=>r(q.result||0); q.onerror=()=>r(0); });
       await mdbPut('__visits', cur+1); visit.idb=cur+1; }catch(e){ visit.idb='нет доступа'; }
})();
async function storeReport(){
  const rows=[];
  rows.push(['Адрес страницы', location.origin]);
  rows.push(['Открытий (localStorage)', String(visit.ls)]);
  rows.push(['Открытий (IndexedDB)', String(visit.idb)]);
  try{ const e=await navigator.storage.estimate(); rows.push(['Место', `${Math.round(e.usage/1048576)} МБ занято из ${Math.round(e.quota/1048576)} МБ`]); }catch(_){ rows.push(['Место','не сообщается']); }
  try{ rows.push(['Постоянное хранение', (navigator.storage&&navigator.storage.persisted) ? ((await navigator.storage.persisted())?'да':'нет') : 'не поддерживается']); }catch(_){ }
  const all=[...MODELS.runtime,...MODELS.isnet,...MODELS.sam_enc,...MODELS.sam_dec]; let have=0;
  for (const f of all){ if (await mdbGet(f[0])) have++; }
  rows.push(['Частей моделей сохранено', `${have} из ${all.length}`]);
  try{ rows.push(['Автосохранение документа', (await idbGet('meta')) ? 'есть' : 'нет']); }catch(_){ rows.push(['Автосохранение документа','нет доступа']); }
  dialog(`<h3>Проверка памяти</h3><p>Открой это окно, закрой Проявку, открой снова и загляни сюда ещё раз. Если счётчик открытий опять 1 — Safari стирает память этой страницы при закрытии.</p>
    <dl class="gest">${rows.map(r=>`<dt>${escapeHtml(r[0])}</dt><dd>${escapeHtml(r[1])}</dd>`).join('')}</dl>`, [['Закрыть',null,true]]);
}

/* ============ boot ============ */
(async function boot(){
  loadPrefs(); $('#mFinger').textContent=S.fingerDraw?'вкл':'выкл';
  setColor(S.color); sizeStage();
  // crash guard: if the previous start died while restoring, start clean and offer the document instead of crashing again
  let crashed=false; try{ crashed=!!localStorage.getItem('proyavka.booting'); localStorage.setItem('proyavka.booting','1'); }catch(_){}
  let ok=false;
  if (!crashed) ok = await restore();
  if (!ok) createDoc(3000,4000,'Без названия');
  try{ localStorage.removeItem('proyavka.booting'); }catch(_){}
  if (crashed) setTimeout(()=>dialog('<h3>Прошлый запуск не удался</h3><p>Похоже, Проявка закрылась, пока восстанавливала документ. Я открыла чистый холст, а сохранённый документ не тронут.</p>',
    [['Не восстанавливать', null], ['Восстановить документ', ()=>{ (async()=>{ try{ localStorage.setItem('proyavka.booting','1'); }catch(_){} const r=await restore(); try{ localStorage.removeItem('proyavka.booting'); }catch(_){} if(!r) toast('Сохранённого документа нет'); })(); }, true]]), 600);
  setTool('brush'); syncSliders();
  if (stage.clientWidth >= 900){ showLayers(true); fitView(); }
  window.addEventListener('resize', ()=>{ sizeStage(); });
  let seen=false; try{ seen=localStorage.getItem('kadr.help')==='1'; }catch(e){}
  const sp=$('#splash'); setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),400); }, 450);
  if (!seen) showHelp();
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(_){}
